<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>playbook · Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0a0b12; --surface:#13141f; --surface-2:#1a1c2b; --surface-3:#20233a;
      --border:#262a3d; --border-2:#323754; --text:#e6e8f0; --dim:#8a8fa3; --faint:#5b6075;
      --accent:#7c5cff; --accent-2:#4d8dff; --up:#2ee6a6; --down:#ff5d6c; --amber:#f5b945;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
    body{background:var(--bg);color:var(--text);line-height:1.55;padding:1.25rem;
      background-image:radial-gradient(900px 400px at 12% -8%, rgba(124,92,255,.10), transparent 60%),
                       radial-gradient(800px 380px at 92% -10%, rgba(77,141,255,.08), transparent 60%);}
    .mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
    .container{max-width:960px;margin:0 auto}
    header h1{font-size:30px;font-weight:700;letter-spacing:-.5px;
      background:linear-gradient(90deg,#fff,#b9a8ff 60%,#7fb0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
    header .sub{font-size:12px;color:var(--dim);margin-top:2px}
    .nav{display:flex;gap:8px;margin:18px 0}
    .nav a{padding:8px 18px;font-size:14px;font-weight:600;text-decoration:none;border-radius:10px;
      background:var(--surface);border:1px solid var(--border);color:var(--dim);transition:.15s}
    .nav a:hover{color:var(--text);border-color:var(--border-2)}
    .nav a.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border:none;box-shadow:0 4px 16px rgba(124,92,255,.3)}

    .verdict{padding:22px 24px;border-radius:16px;margin-bottom:1.4rem;border:1px solid var(--border-2);position:relative;overflow:hidden}
    .verdict::before{content:'';position:absolute;left:0;top:0;height:100%;width:4px}
    .verdict .label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:8px}
    .verdict .text{font-size:21px;font-weight:700}
    .verdict .vix{font-size:14px;margin-top:8px;color:var(--dim)}
    .verdict.green{background:rgba(46,230,166,.08)} .verdict.green::before{background:var(--up)} .verdict.green .text{color:var(--up)}
    .verdict.neutral{background:var(--surface)} .verdict.neutral::before{background:var(--dim)} .verdict.neutral .text{color:var(--text)}
    .verdict.amber{background:rgba(245,185,69,.08)} .verdict.amber::before{background:var(--amber)} .verdict.amber .text{color:var(--amber)}
    .verdict.red{background:rgba(255,93,108,.08)} .verdict.red::before{background:var(--down)} .verdict.red .text{color:var(--down)}

    .indices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.4rem}
    .idx{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;text-align:center}
    .idx .name{font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.5px}
    .idx .price{font-size:24px;font-weight:700;margin:5px 0;color:#fff}
    .idx .chg{font-size:15px;font-weight:700}
    .idx .pre{font-size:10px;background:rgba(77,141,255,.15);color:var(--accent-2);padding:3px 7px;border-radius:5px;margin-top:5px;display:inline-block}
    .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--dim)}

    .sect{font-size:15px;font-weight:600;margin-bottom:12px;color:var(--text)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px;margin-bottom:1.4rem}
    .scard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px;text-decoration:none;color:var(--text);transition:.15s;position:relative;overflow:hidden}
    .scard::before{content:'';position:absolute;left:0;top:0;height:100%;width:3px;background:linear-gradient(180deg,var(--accent),var(--accent-2));opacity:0;transition:.15s}
    .scard:hover{border-color:var(--accent)}.scard:hover::before{opacity:1}
    .scard .code{font-size:18px;font-weight:700;color:var(--accent-2)}
    .scard .nm{font-size:12px;color:var(--dim)}
    .scard .cnt{font-size:26px;font-weight:700;margin-top:6px;color:#fff}
    .scard .new{font-size:11px;color:var(--up);font-weight:700}
    .footer{margin-top:1.6rem;padding-top:1rem;border-top:1px solid var(--border);font-size:12px;color:var(--faint)}
    .loading{text-align:center;padding:2rem;color:var(--dim)}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>playbook</h1>
      <div class="sub" id="updated">讀緊…</div>
    </header>

    <div class="nav">
      <a href="overview.html" class="active">Market</a>
      <a href="dashboard.html">Scanner</a>
    </div>

    <div id="verdictBox"></div>
    <div class="indices" id="indices"></div>

    <div class="sect">今日策略總覽</div>
    <div class="grid" id="stratGrid"></div>

    <div class="footer">
      <p id="marketTime">大市數據：…</p>
      <p id="scanTime">掃描數據：…</p>
    </div>
  </div>

  <script>
    const STRATEGY_NAMES={S1:'順勢交易',S2:'趨勢終結',S3:'突破交易',S4:'假突破',S5:'支持阻力',S6:'圖表形態'};
    async function load(){
      let market=null,scan=null;
      try{market=await(await fetch('https://raw.githubusercontent.com/Sasamkeefund/playbook/main/market.json?t='+Date.now())).json();}catch(e){}
      try{scan=await(await fetch('https://raw.githubusercontent.com/Sasamkeefund/playbook/main/data.json?t='+Date.now())).json();}catch(e){}
      renderMarket(market);renderStrategies(scan);
      document.getElementById('updated').textContent='開市前大市檢查 · Limit Order 影響';
      document.getElementById('marketTime').textContent='大市數據：'+(market?market.updated:'攞唔到');
      document.getElementById('scanTime').textContent='掃描數據：'+(scan?scan.updated:'攞唔到');
    }
    function renderMarket(m){
      const vb=document.getElementById('verdictBox'),idx=document.getElementById('indices');
      if(!m||!m.verdict){vb.innerHTML='<div class="verdict amber"><div class="text">— 攞唔到大市數據</div></div>';idx.innerHTML='';return;}
      const v=m.verdict;
      vb.innerHTML=`<div class="verdict ${v.color}"><div class="label">大市判斷 · Limit Order</div><div class="text">${v.text}</div>${v.vix?`<div class="vix">${v.vix}</div>`:''}</div>`;
      const card=(n,q)=>{if(!q)return `<div class="idx"><div class="name">${n}</div><div class="price">—</div></div>`;
        const cls=q.chgPct>0?'up':q.chgPct<0?'down':'flat';
        return `<div class="idx"><div class="name">${n}</div><div class="price mono">${q.price}</div><div class="chg mono ${cls}">${q.chgPct>0?'+':''}${q.chgPct}%</div>${q.isPremarket?'<div class="pre">Pre-market</div>':''}</div>`;};
      idx.innerHTML=card('SPY',m.spy)+card('QQQ',m.qqq)+card('VIX',m.vix);
    }
    function renderStrategies(scan){
      const g=document.getElementById('stratGrid');
      if(!scan){g.innerHTML='<div class="loading">攞唔到掃描數據</div>';return;}
      g.innerHTML=Object.keys(STRATEGY_NAMES).map(s=>{
        const sum=scan.summary[s]||{count:0};
        let nc=0;if(scan.stocks)nc=scan.stocks.filter(x=>x.strategies[s]&&x.strategies[s].isNew).length;
        return `<a class="scard" href="dashboard.html"><div class="code">${s}</div><div class="nm">${STRATEGY_NAMES[s]}</div><div class="cnt">${sum.count}</div>${nc>0?`<div class="new">+${nc} NEW</div>`:''}</a>`;
      }).join('');
    }
    load();
  </script>
</body>
</html>
