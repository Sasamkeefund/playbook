name: S7 Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Run S7 backtest
        run: python backtest_s7.py
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add bt_s7_trades.json bt_s7_report.txt bt_s7_summary.json bt_s7_app.json
          git commit -m "S7 backtest results" || echo "no changes"
          git push
