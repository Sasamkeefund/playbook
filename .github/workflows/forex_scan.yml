name: Forex Scan (S1)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Run forex scanner
        run: python scan_forex.py

      - name: Commit forex_data.json
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add forex_data.json forex_charts.json
          git diff --staged --quiet || git commit -m "forex scan $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase origin main
          git push
