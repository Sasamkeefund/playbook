name: Daily S1 Scanner

on:
  schedule:
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Run S1 Scanner
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python scan_s1.py
      - name: Commit data.json
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Auto: Update S1 scan $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
