<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>playbook</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif; }
    body { background: #fafaf8; color: #2c2c2a; line-height: 1.6; padding: 1rem; }
    .container { max-width: 1400px; margin: 0 auto; }
    
    header { margin-bottom: 2rem; }
    header h1 { font-size: 28px; font-weight: 600; margin-bottom: 0.5rem; }
    header p { font-size: 13px; color: #888780; }
    
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .tab-btn {
      padding: 10px 16px; font-size: 14px; font-weight: 500;
      background: #fff; border: 1px solid #d3d1c7; border-radius: 8px;
      cursor: pointer; transition: all 0.2s;
      color: #2c2c2a;
    }
    .tab-btn:hover { border-color: #888780; background: #f1efe8; }
    .tab-btn.active {
      background: #378add; color: white; border-color: #378add;
    }
    
    .controls { display: flex; gap: 12px; margin-bottom: 1.5rem; flex-wrap: wrap; }
    input[type="text"], select {
      padding: 8px 12px; border: 1px solid #d3d1c7; border-radius: 6px;
      font-size: 13px; background: white;
    }
    input[type="text"] { flex: 1; min-width: 150px; }
    select { min-width: 120px; }
    
    .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
    .summary-card {
      background: white; border: 1px solid #d3d1c7; border-radius: 8px;
      padding: 12px; text-align: center;
    }
    .summary-card label { font-size: 11px; color: #888780; text-transform: uppercase; }
    .summary-card .value { font-size: 20px; font-weight: 600; color: #378add; margin-top: 4px; }
    
    table { width: 100%; border-collapse: collapse; background: white; border: 1px solid #d3d1c7; border-radius: 8px; overflow: hidden; }
    thead { background: #f1efe8; }
    th { padding: 12px; text-align: left; font-size: 11px; font-weight: 600; color: #5f5e5a; text-transform: uppercase; }
    td { padding: 12px; border-top: 1px solid #d3d1c7; font-size: 13px; }
    tr:hover { background: #fafaf8; }
    
    .ticker-cell { font-weight: 600; color: #2c2c2a; }
    .positive { color: #639922; }
    .negative { color: #a32d2d; }
    .score-badge {
      display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600;
      background: #f1efe8; color: #5f5e5a;
    }
    .score-badge.perfect { background: #097f5f; color: white; }
    
    .cond-cell { color: #639922; font-size: 14px; }
    .cond-cell.fail { color: #a32d2d; }
    
    .empty { text-align: center; padding: 2rem; color: #888780; }
    .loading { text-align: center; padding: 2rem; color: #888780; }
    
    .footer { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #d3d1c7; font-size: 12px; color: #888780; }
    
    @media (max-width: 900px) {
      table { font-size: 12px; }
      th, td { padding: 8px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>playbook</h1>
      <p id="updated">更新於 ...</p>
      <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
        <button onclick="reloadData()" id="reloadBtn" style="padding:8px 14px; font-size:13px; font-weight:500; background:#378add; color:#fff; border:none; border-radius:8px; cursor:pointer;">🔄 重新載入數據</button>
        <a href="https://github.com/Sasamkeefund/playbook/actions/workflows/scan.yml" target="_blank" rel="noopener" style="padding:8px 14px; font-size:13px; font-weight:500; background:#fff; color:#2c2c2a; border:1px solid #d3d1c7; border-radius:8px; text-decoration:none;">⚙️ 去 GitHub 重新掃描</a>
      </div>
    </header>
    
    <div class="tabs" id="tabs"></div>
    
    <div class="controls">
      <input type="text" id="searchTicker" placeholder="搜尋 Ticker（例如 NVDA）...">
      <select id="filterScore">
        <option value="">所有 Score</option>
        <option value="5">Perfect (5/5)</option>
        <option value="4">4 / (4-5)</option>
        <option value="3">3 / (3-5)</option>
      </select>
      <select id="filterStreak">
        <option value="">所有 Streak</option>
        <option value="5">≥ 5 日</option>
        <option value="10">≥ 10 日</option>
      </select>
    </div>
    
    <div class="summary" id="summary"></div>
    
    <div style="overflow-x: auto;">
      <table id="table">
        <thead>
          <tr>
            <th style="text-align:center;width:50px;">NEW</th>
            <th>Ticker</th>
            <th style="text-align: right;">Close</th>
            <th style="text-align: right;">1D%</th>
            <th style="text-align: right;">EMA</th>
            <th style="text-align: right;">RSI</th>
            <th style="text-align: center;">C1</th>
            <th style="text-align: center;">C2</th>
            <th style="text-align: center;">C3</th>
            <th style="text-align: center;">C4</th>
            <th style="text-align: center;">C5</th>
            <th style="text-align: center;">Req</th>
            <th style="text-align: center;">Bonus</th>
            <th style="text-align: center;">Streak</th>
            <th style="min-width: 200px;">入場建議</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    
    <div class="footer">
      <p>實時讀取：<a href="https://github.com/Sasamkeefund/playbook" target="_blank">GitHub data.json</a></p>
    </div>
  </div>

  <!-- TradingView 圖 modal -->
  <div id="chartModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:1000; padding:2vh 2vw;">
    <div style="background:#fff; border-radius:12px; height:96vh; display:flex; flex-direction:column; overflow:hidden;">
      <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 16px; border-bottom:1px solid #d3d1c7;">
        <strong id="chartTitle" style="font-size:16px;">—</strong>
        <div style="display:flex; gap:10px; align-items:center;">
          <a id="chartOpenTV" href="#" target="_blank" rel="noopener" style="font-size:13px; color:#378add; text-decoration:none;">喺 TradingView 開 ↗</a>
          <button onclick="closeChart()" style="font-size:20px; background:none; border:none; cursor:pointer; color:#888780; line-height:1;">✕</button>
        </div>
      </div>
      <div id="chartContainer" style="flex:1;"></div>
    </div>
  </div>

  <script>
    function openChart(ticker) {
      document.getElementById('chartTitle').textContent = ticker;
      document.getElementById('chartOpenTV').href = 'https://www.tradingview.com/chart/?symbol=' + ticker;
      const c = document.getElementById('chartContainer');
      c.innerHTML = '';

      // TradingView 官方嵌入結構
      const container = document.createElement('div');
      container.className = 'tradingview-widget-container';
      container.style.height = '100%';
      container.style.width = '100%';

      const widgetDiv = document.createElement('div');
      widgetDiv.className = 'tradingview-widget-container__widget';
      widgetDiv.style.height = '100%';
      widgetDiv.style.width = '100%';
      container.appendChild(widgetDiv);

      const script = document.createElement('script');
      script.type = 'text/javascript';
      script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';
      script.async = true;
      script.textContent = JSON.stringify({
        autosize: true,
        symbol: ticker,
        interval: 'D',
        timezone: 'Etc/UTC',
        theme: 'light',
        style: '1',
        locale: 'en',
        withdateranges: true,
        allow_symbol_change: true,
        studies: ['RSI@tv-basicstudies'],
        support_host: 'https://www.tradingview.com'
      });
      container.appendChild(script);

      c.appendChild(container);
      document.getElementById('chartModal').style.display = 'block';
    }
    function closeChart() {
      document.getElementById('chartModal').style.display = 'none';
      document.getElementById('chartContainer').innerHTML = '';
    }
    document.getElementById('chartModal').addEventListener('click', function(e) {
      if (e.target === this) closeChart();
    });
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeChart(); });
  </script>


  <script>
    const STRATEGY_NAMES = {
      S1: { name: '順勢交易', dir: 'Long', thresh: '5/5' },
      S2: { name: '趨勢終結', dir: 'Short', thresh: '4/5' },
      S3: { name: '突破交易', dir: 'Long', thresh: '4/5' },
      S4: { name: '假突破', dir: 'L/S', thresh: '3/4' },
      S5: { name: '支持阻力', dir: 'Long', thresh: '4/4' },
      S6: { name: '圖表形態', dir: 'Long', thresh: '4/5' },
    };
    
    const COND_LABELS = {
      S1: ['Price > EMA20', 'Price > EMA50', 'Price > EMA200↑', 'RSI 40-70', '3M>5% 1M<25%'],
      S2: ['Close < EMA50', 'Close < EMA200', '1D% < -5%', 'RelVol > 2', 'RSI < 35'],
      S3: ['距52W高≤4%', 'Close > EMA50', 'RelVol<0.75', 'ATR5<ATR14', '3M% > 10%'],
      S4: ['距52W高≤8%', 'RSI 45-65', '1W% -4~2%', '1M% < ±8%', ''],
      S5: ['Close > EMA50', 'Close > EMA200', 'RSI 30-55', '1M% -20~-5%', ''],
      S6: ['Close > EMA20', 'Close > EMA50', '1M% > 8%', '1W% -5~0%', 'RelVol < 0.8'],
    };
    
    // 入場建議邏輯 — 照返 playbook 每個策略嘅 bonus 規則
    function getVerdict(tab, strat) {
      const req = strat.score;
      const bonus = strat.bonusScore;
      const b = strat.bonus || [];
      const reqMax = (tab === 'S4' || tab === 'S5') ? 4 : 5;

      if (tab === 'S1') {
        const b2 = b[1], b3 = b[2], b4 = b[3];
        if (req < reqMax) return { text: '\ud83d\udc40 候選 — 等收市確認返上 EMA20', color: 'amber' };
        if (bonus <= 2) return { text: '❌ Bonus 唔夠 — 唔入', color: 'red' };
        if (!b2) return { text: '⚠️ b2 三線未齊 — 極細倉或唔入', color: 'amber' };
        if (bonus >= 4) return { text: '\ud83d\udd25 高質候選 — 入場前用互動檢查表確認假突破', color: 'green' };
        if (b3 && b4) return { text: '✅ 中質候選 — 縮量+回調中，互動檢查表確認', color: 'green' };
        return { text: '⚠️ b3+b4 未同時過 — 等縮量回調', color: 'amber' };
      }

      if (tab === 'S6') {
        const b1 = b[0], b5 = b[4];
        if (req < reqMax) return { text: '— 未 ready', color: 'red' };
        if (b1 && b5) return { text: '\ud83d\udd25 頂級 — 優先入場，正常倉', color: 'green' };
        if (b1 || b5) return { text: '✅ 良好 — 正常入場', color: 'green' };
        if (bonus >= 3) return { text: '⚠️ 一般 — 細倉，R:R ≥ 3:1', color: 'amber' };
        return { text: '❌ 跳過 — b1 b5 都 Fail，Bonus < 3', color: 'red' };
      }

      if (tab === 'S3') {
        if (req < reqMax) return { text: '— 未 ready', color: 'red' };
        if (bonus >= 4) return { text: '\ud83d\udd25 高質 Buildup — Set Alert，突破用手法 A/B/C', color: 'green' };
        if (bonus >= 2) return { text: '✅ Buildup 候選 — Set Alert 等突破（R:R 參考）', color: 'green' };
        return { text: '⚠️ Buildup 質素偏低 — 留意縮量收窄', color: 'amber' };
      }

      if (tab === 'S5') {
        if (req < reqMax) return { text: '— 未 ready', color: 'red' };
        if (bonus >= 3) return { text: '✅ 可深入 — 人手確認 0.786 + 推進浪', color: 'green' };
        return { text: '⚠️ 人手確認整理區 + 0.786 Fib', color: 'amber' };
      }

      if (req >= reqMax || strat.ready) return { text: '（未實戰）Bonus ' + bonus, color: 'amber' };
      return { text: '—', color: 'red' };
    }

    let globalData = null;
    let activeTab = 'S1';
    
    async function loadData() {
      try {
        const url = 'https://raw.githubusercontent.com/Sasamkeefund/playbook/main/data.json?t=' + Date.now();
        const resp = await fetch(url);
        const data = await resp.json();
        globalData = data;
        document.getElementById('updated').textContent = `更新於 ${data.updated}`;
        render();
      } catch (e) {
        document.getElementById('updated').textContent = '❌ 無法讀取 data.json';
      }
    }

    async function reloadData() {
      const btn = document.getElementById('reloadBtn');
      const orig = btn.textContent;
      btn.textContent = '⏳ 載入緊…';
      btn.disabled = true;
      await loadData();
      btn.textContent = '✅ 已更新';
      setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 1500);
    }
    
    function getFilteredStocks() {
      if (!globalData) return [];
      let stocks = globalData.stocks.filter(s => s.strategies[activeTab].ready);
      
      const search = document.getElementById('searchTicker').value.toUpperCase();
      if (search) {
        stocks = stocks.filter(s => s.ticker.includes(search));
      }
      
      const scoreFilter = document.getElementById('filterScore').value;
      if (scoreFilter) {
        const minScore = parseInt(scoreFilter);
        stocks = stocks.filter(s => s.strategies[activeTab].score >= minScore);
      }
      
      const streakFilter = document.getElementById('filterStreak').value;
      if (streakFilter) {
        const minStreak = parseInt(streakFilter);
        stocks = stocks.filter(s => s.strategies[activeTab].streak >= minStreak);
      }
      
      return stocks;
    }
    
    function renderTabs() {
      const tabsHtml = Object.entries(STRATEGY_NAMES).map(([key, val]) => {
        const count = globalData.stocks.filter(s => s.strategies[key].ready).length;
        const active = key === activeTab ? 'active' : '';
        return `<button class="tab-btn ${active}" onclick="switchTab('${key}')">${key} <span style="opacity:0.6">(${count})</span></button>`;
      }).join('');
      document.getElementById('tabs').innerHTML = tabsHtml;
    }
    
    function renderSummary() {
      const meta = STRATEGY_NAMES[activeTab];
      const stocks = globalData.stocks.filter(s => s.strategies[activeTab].ready);
      const maxScore = activeTab === 'S5' ? 4 : activeTab === 'S4' ? 4 : 5;
      const perfect = stocks.filter(s => s.strategies[activeTab].score === maxScore).length;
      const avgBonus = stocks.length ? (stocks.reduce((a, s) => a + s.strategies[activeTab].bonusScore, 0) / stocks.length).toFixed(1) : 0;
      
      const html = `
        <div class="summary-card">
          <label>Ready</label>
          <div class="value">${stocks.length}</div>
        </div>
        <div class="summary-card">
          <label>Perfect</label>
          <div class="value">${perfect}</div>
        </div>
        <div class="summary-card">
          <label>Avg Bonus</label>
          <div class="value">${avgBonus}</div>
        </div>
        <div class="summary-card">
          <label>Max Streak</label>
          <div class="value">${stocks.length ? Math.max(...stocks.map(s => s.strategies[activeTab].streak)) : 0}</div>
        </div>
      `;
      document.getElementById('summary').innerHTML = html;
    }
    
    function renderTable() {
      const stocks = getFilteredStocks();
      const maxScore = activeTab === 'S5' ? 4 : activeTab === 'S4' ? 4 : 5;
      const maxBonus = activeTab === 'S5' ? 4 : activeTab === 'S4' ? 4 : 5;
      const condLabels = COND_LABELS[activeTab];
      const c5Exist = condLabels[4];
      
      let html = '';
      if (stocks.length === 0) {
        html = `<tr><td colspan="15" class="empty">No stocks match filters</td></tr>`;
      } else {
        html = stocks.map(s => {
          const strat = s.strategies[activeTab];
          const chgClass = s.chgPct > 0 ? 'positive' : s.chgPct < 0 ? 'negative' : '';
          const verdict = getVerdict(activeTab, strat);
          
          const cond1 = `<td style="text-align: center; color: ${strat.conds[0] ? '#639922' : '#a32d2d'};">` + (strat.conds[0] ? '✓' : '✗') + '</td>';
          const cond2 = `<td style="text-align: center; color: ${strat.conds[1] ? '#639922' : '#a32d2d'};">` + (strat.conds[1] ? '✓' : '✗') + '</td>';
          const cond3 = `<td style="text-align: center; color: ${strat.conds[2] ? '#639922' : '#a32d2d'};">` + (strat.conds[2] ? '✓' : '✗') + '</td>';
          const cond4 = `<td style="text-align: center; color: ${strat.conds[3] ? '#639922' : '#a32d2d'};">` + (strat.conds[3] ? '✓' : '✗') + '</td>';
          const cond5 = c5Exist ? `<td style="text-align: center; color: ${strat.conds[4] ? '#639922' : '#a32d2d'};">` + (strat.conds[4] ? '✓' : '✗') + '</td>' : '<td style="text-align: center;">–</td>';
          
          return `
            <tr>
              <td style="text-align:center;">${strat.isNew ? '<span style="background:#097f5f;color:#fff;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600;">NEW</span>' : ''}</td>
              <td class="ticker-cell"><a href="#" onclick="openChart('${s.ticker}'); return false;" style="color:#378add;text-decoration:none;">${s.ticker} 📈</a></td>
              <td style="text-align: right;">$${s.close.toFixed(2)}</td>
              <td style="text-align: right;" class="${chgClass}">
                ${s.chgPct > 0 ? '+' : ''}${s.chgPct.toFixed(2)}%
              </td>
              <td style="text-align: right; font-size: 11px; color: #888780;">
                ${s.ema20.toFixed(0)}/${s.ema50.toFixed(0)}/${s.ema200.toFixed(0)}
              </td>
              <td style="text-align: right;">${s.rsi.toFixed(1)}</td>
              ${cond1}${cond2}${cond3}${cond4}${cond5}
              <td style="text-align: center;"><span class="score-badge ${strat.score === maxScore ? 'perfect' : ''}">${strat.score}/${maxScore}</span></td>
              <td style="text-align: center;"><span class="score-badge ${strat.bonusScore >= 3 ? 'perfect' : ''}">${strat.bonusScore}/${maxBonus}</span></td>
              <td style="text-align: center; font-weight: 600;">${strat.streak}</td>
              <td style="font-size: 12px; color: ${verdict.color === 'green' ? '#097f5f' : verdict.color === 'amber' ? '#854f0b' : '#a32d2d'};">${verdict.text}</td>
            </tr>
          `;
        }).join('');
      }
      document.getElementById('tbody').innerHTML = html;
    }
    
    function switchTab(tab) {
      activeTab = tab;
      document.getElementById('searchTicker').value = '';
      document.getElementById('filterScore').value = '';
      document.getElementById('filterStreak').value = '';
      render();
    }
    
    function render() {
      renderTabs();
      renderSummary();
      renderTable();
    }
    
    document.getElementById('searchTicker').addEventListener('input', () => renderTable());
    document.getElementById('filterScore').addEventListener('change', () => renderTable());
    document.getElementById('filterStreak').addEventListener('change', () => renderTable());
    
    loadData();
  </script>
</body>
</html>
