<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>playbook · Watchlist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root{--bg:#0a0b12;--surface:#13141f;--surface-2:#1a1c2b;--surface-3:#20233a;
      --border:#262a3d;--border-2:#323754;--text:#e6e8f0;--dim:#8a8fa3;--faint:#5b6075;
      --accent:#7c5cff;--accent-2:#4d8dff;--down:#ff5d6c;--amber:#f5b945;}
    body.work{--bg:#ffffff;--surface:#ffffff;--surface-2:#f3f3f3;--surface-3:#e9e9e9;
      --border:#d0d0d0;--border-2:#bcbcbc;--text:#1a1a1a;--dim:#555;--faint:#888;
      --accent:#444;--accent-2:#444;--down:#b00020;--amber:#7a5c00;background-image:none !important;}
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh}
    body{padding:1.25rem;background-image:radial-gradient(900px 400px at 12% -8%,rgba(124,92,255,.10),transparent 60%),radial-gradient(800px 380px at 92% -10%,rgba(77,141,255,.08),transparent 60%);}
    body.work{background-image:none}
    .topbar{position:sticky;top:0;z-index:50;background:rgba(19,20,31,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);margin:-1.25rem -1.25rem 1.4rem;padding:11px 1.25rem}
    body.work .topbar{background:#f3f3f3 !important}
    .topbar-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
    .brand{font-size:20px;font-weight:700;background:linear-gradient(90deg,#fff,#b9a8ff 60%,#7fb0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
    body.work .brand{background:none;-webkit-text-fill-color:#333;color:#333}
    .topnav{display:flex;gap:6px}
    .topnav a{padding:7px 16px;font-size:14px;font-weight:600;text-decoration:none;border-radius:9px;color:var(--dim);transition:.15s}
    .topnav a:hover{color:var(--text);background:var(--surface-2)}
    .topnav a.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 4px 14px rgba(124,92,255,.3)}
    body.work .topnav a{color:#555}
    body.work .topnav a.active{background:#dcdcdc !important;color:#1a1a1a !important;box-shadow:none !important}
    .topactions{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .btn{padding:7px 12px;font-size:13px;font-weight:600;border-radius:10px;cursor:pointer;border:1px solid var(--border-2);background:var(--surface-2);color:var(--text);transition:.15s}
    .btn:hover{border-color:var(--accent)}
    body.work .btn{background:#e9e9e9;color:#1a1a1a;border-color:#ccc}
    .container{max-width:1100px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column}
    .section-title{font-size:12px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
    .tablewrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow-x:auto}
    table{width:100%;border-collapse:collapse}
    thead{background:var(--surface-2)}
    .wltab{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--dim);cursor:pointer;font-size:13px;font-weight:600}
    .wltab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    body.work .wltab.active{background:#444;border-color:#444}
    th{padding:13px 12px;text-align:left;font-size:10.5px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;white-space:nowrap}
    td{padding:12px;border-top:1px solid var(--border);font-size:13px}
    tbody tr:hover{background:var(--surface-2)}
    .ticker{font-weight:700;color:var(--accent-2);font-size:15px}
    .note-input{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text);font-size:12px;font-family:inherit}
    body.work .note-input{background:#fff;color:#1a1a1a;border-color:#ccc}
    .note-input:focus{outline:none;border-color:var(--accent)}
    .del-btn{padding:4px 9px;font-size:14px;border-radius:6px;border:none;background:transparent;color:var(--down);cursor:pointer}
    .del-btn:hover{background:rgba(255,93,108,.15)}
    .empty{text-align:center;padding:2.5rem;color:var(--dim)}
    .mono{font-family:'JetBrains Mono',ui-monospace,monospace}
    .ticker-link{cursor:pointer;text-decoration:none}
    .ticker-link:hover{text-decoration:underline}
    /* chart modal */
    #chartModal{display:none;position:fixed;inset:0;background:rgba(5,6,12,.8);backdrop-filter:blur(4px);z-index:1000;padding:3vh 4vw}
    #chartModal.show{display:flex;align-items:center;justify-content:center}
    .modal-inner{background:var(--surface);border:1px solid var(--border-2);border-radius:14px;width:100%;max-width:1200px;height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
    .modal-head{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-bottom:1px solid var(--border)}
    .modal-close{font-size:20px;background:none;border:none;cursor:pointer;color:var(--dim);line-height:1}
    .modal-close:hover{color:var(--text)}
    .mbtn{padding:7px 13px;font-size:13px;font-weight:600;border-radius:10px;cursor:pointer;border:none;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
    body.work .modal-inner{background:#fff}
    .dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--accent);animation:pulse 1.2s infinite}
    @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
  
    body.mobile table{font-size:14px}
    body.mobile th,body.mobile td{padding:13px 10px}
    body.mobile thead th:first-child,body.mobile tbody td:first-child{position:sticky;left:0;background:var(--surface);z-index:5;box-shadow:2px 0 4px rgba(0,0,0,.2)}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">playbook</div>
      <nav class="topnav">
        <a href="overview.html">📊 Market</a>
        <a href="dashboard.html">🔍 Screener</a>
        <a href="checklist.html">✅ Checklist</a>
        <a href="watchlist.html" class="active">📋 Watchlist</a>
        <a href="paper.html">📒 Paper Trade</a>
        <a href="backtest.html">🧪 Backtest</a>
      </nav>
      <div class="topactions">
        <button onclick="toggleWork()" id="workBtn" class="btn">🕶 返工 Mode</button>
        <button onclick="loadList()" class="btn">🔄 刷新</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="section-title">📌 My Watchlist <span id="status" style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--dim)"></span></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin:12px 0">
      <button class="wltab active" data-s="ALL" onclick="switchWL('ALL')">全部</button>
      <button class="wltab" data-s="S1" onclick="switchWL('S1')">S1 順勢</button>
      <button class="wltab" data-s="S2" onclick="switchWL('S2')">S2</button>
      <button class="wltab" data-s="S3" onclick="switchWL('S3')">S3</button>
      <button class="wltab" data-s="S4" onclick="switchWL('S4')">S4</button>
      <button class="wltab" data-s="S5" onclick="switchWL('S5')">S5</button>
      <button class="wltab" data-s="S6" onclick="switchWL('S6')">S6 旗形</button>
      <button class="wltab" data-s="S7" onclick="switchWL('S7')">S7 VCP</button>
    </div>
    <div class="tablewrap">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"><tr><td class="empty"><span class="dot"></span> 讀緊…</td></tr></tbody>
      </table>
    </div>
  </div>

  <div id="chartModal">
    <div class="modal-inner">
      <div class="modal-head">
        <div style="display:flex;gap:12px;align-items:center">
          <button onclick="closeChart()" class="mbtn">← 返 Watchlist</button>
          <strong id="chartTitle" class="mono" style="font-size:16px">—</strong>
        </div>
        <div style="display:flex;gap:12px;align-items:center">
          <a id="chartOpenTV" href="#" target="_blank" rel="noopener" style="font-size:13px;color:var(--accent-2);text-decoration:none">喺 TradingView 開 ↗</a>
          <button onclick="closeChart()" class="modal-close">✕</button>
        </div>
      </div>
      <div id="chartContainer" style="flex:1"></div>
    </div>
  </div>

  <script>
const _MODES=['trader','work','mobile'];
    const _LBL={trader:'🌙 Trader Mode',work:'🕶 返工 Mode',mobile:'📱 Mobile Mode'};
    function _curMode(){return document.body.classList.contains('mobile')?'mobile':document.body.classList.contains('work')?'work':'trader';}
    function _setMode(m){document.body.classList.toggle('work',m==='work');document.body.classList.toggle('mobile',m==='mobile');var b=document.getElementById('workBtn');if(b)b.textContent=_LBL[m];try{document.cookie='uimode='+m+';path=/;max-age=31536000';}catch(e){}}
    function toggleWork(){_setMode(_MODES[(_MODES.indexOf(_curMode())+1)%3]);}
    document.addEventListener('keydown',function(e){if(e.key==='`'){e.preventDefault();var w=document.body.classList.contains('work');document.body.classList.remove('mobile');document.body.classList.toggle('work',!w);var b=document.getElementById('workBtn');if(b)b.textContent=_LBL[_curMode()];}});
    (function(){try{var m=(document.cookie.match(/uimode=(\w+)/)||[])[1];if(m&&_MODES.includes(m))_setMode(m);}catch(e){}})();

    const WL_API='https://script.google.com/macros/s/AKfycbw-taBatpcuHXt5daIGq3Bo7lGw9OvdtsNeg292qdN0eW4RyxWLV4qf-oACvaVHHUI-Bg/exec';
    const STRAT={S1:'順勢',S2:'趨結',S3:'突破',S4:'假突',S5:'支阻',S6:'圖表'};
    let list=[], dataMap={}, fibMap={}, tvOpenSet=new Set(), overrideMap={};
    async function loadList(){
      document.getElementById('status').innerHTML='<span class="dot"></span> 讀緊…';
      const now=new Date();
      const hourKey=now.getFullYear()+''+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0')+String(now.getHours()).padStart(2,'0');
      const [scanR, wlR, fibR, paperR, ovR] = await Promise.allSettled([
        fetch('https://raw.githubusercontent.com/Sasamkeefund/playbook/main/data.json?t='+hourKey).then(r=>r.json()),
        fetch(WL_API).then(r=>r.json()),
        fetch(WL_API+'?action=fib_all&t='+Date.now()).then(r=>r.json()),
        fetch(WL_API+'?action=paper_list&t='+Date.now()).then(r=>r.json()),
        fetch(WL_API+'?action=override_all&t='+Date.now()).then(r=>r.json())
      ]);
      if(scanR.status==='fulfilled'){
        (scanR.value.stocks||[]).forEach(s=>{dataMap[s.ticker.toUpperCase()]=s;});
      }
      if(wlR.status==='fulfilled'){
        list=wlR.value.watchlist||[];
        document.getElementById('status').textContent='共 '+list.length+' 隻';
      }else{
        document.getElementById('status').textContent='❌ 讀取失敗';
      }
      fibMap = (fibR.status==='fulfilled')? (fibR.value||{}) : {};
      overrideMap = (ovR.status==='fulfilled')? (ovR.value||{}) : {};
      tvOpenSet = (paperR.status==='fulfilled')
        ? new Set((paperR.value.open||[]).filter(p=>p.group==='TV').map(p=>p.ticker.toUpperCase()))
        : new Set();
      render();
    }
    async function toggleTVTrack(ticker,checkbox){
      ticker=ticker.toUpperCase();
      if(checkbox.checked){
        const s=dataMap[ticker];
        const strat=(s&&wlTab!=='ALL')?s.strategies[wlTab]:null;
        const cd=(strat&&strat.conds)||[];
        const bn=(strat&&strat.bonus)||[];
        const today=new Date().toISOString().slice(0,10);
        const reqMax=(wlTab==='S5'||wlTab==='S4'||wlTab==='S1V1')?4:(wlTab==='S7'?6:5);
        const reqTxt=strat?String(strat.score):'';
        const cv=(strat&&strat.condVals)||[];
        const bv=(strat&&strat.bonusVals)||[];
        const bonusBreak=bn.map((x,i)=>'b'+(i+1)+(x?'✓':'✗')).join(' ');
        const bonusTxt=strat?(strat.bonusScore+'::'+bonusBreak):'';
        const trendVal=strat?(strat.streakBefore??strat.recentMaxStreak??strat.macroStreak??''):'';
        const body={action:'paper_open',ticker,group:'TV',entryDate:today,entry:'',stop:'',
              state:(wlTab==='ALL'?'':wlTab)+' | ',
              rsi:s?s.rsi:'',
              c1:cv[0]??(cd[0]?1:0), c2:cv[1]??(cd[1]?1:0), c3:cv[2]??(cd[2]?1:0), c4:cv[3]??(cd[3]?1:0), c5:cv[4]??(cd[4]?1:0),
              b1:bv[0]??(bn[0]?1:0), b2:bv[1]??(bn[1]?1:0), b3:bv[2]??(bn[2]?1:0), b4:bv[3]??(bn[3]?1:0), b5:bv[4]??(bn[4]?1:0),
              req:reqTxt, streak:strat?strat.streak:'', trend:trendVal,
              bonus:bonusTxt};
        if(wlTab==='S6'&&s&&s.rvol!=null)body.breakoutRvol=s.rvol;
        try{
          await fetch(WL_API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
            body:JSON.stringify(body)});
          tvOpenSet.add(ticker);
        }catch(e){alert('加入失敗，再試');checkbox.checked=false;}
      }else{
        if(!confirm('確定由「我的記錄」移除 '+ticker+'？（未平倉都會直接刪走）')){checkbox.checked=true;return;}
        try{
          await fetch(WL_API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
            body:JSON.stringify({action:'paper_remove',ticker,group:'TV',status:'open'})});
          tvOpenSet.delete(ticker);
        }catch(e){alert('移除失敗，再試');checkbox.checked=true;}
      }
    }
    function stratBadges(ticker){
      const s=dataMap[ticker.toUpperCase()];
      if(!s)return '<span style="color:var(--faint);font-size:11px">—</span>';
      const ready=Object.keys(STRAT).filter(k=>s.strategies[k]&&s.strategies[k].ready);
      if(!ready.length)return '<span style="color:var(--faint);font-size:11px">冇 ready</span>';
      return ready.map(k=>`<span style="display:inline-block;padding:2px 7px;margin:1px;border-radius:6px;background:rgba(124,92,255,.15);color:var(--accent);font-size:11px;font-weight:700">${k}</span>`).join('');
    }
    function priceCell(ticker){
      const s=dataMap[ticker.toUpperCase()];
      if(!s)return '<span style="color:var(--faint)">—</span>';
      const ch=s.chgPct>0?'#2ee6a6':s.chgPct<0?'#ff5d6c':'var(--dim)';
      return `<span class="mono">$${s.close.toFixed(2)}</span> <span class="mono" style="color:${ch};font-size:11px">${s.chgPct>0?'+':''}${s.chgPct.toFixed(2)}%</span>`;
    }
    function ema20Cell(ticker){
      const s=dataMap[ticker.toUpperCase()];
      if(!s)return '<span style="color:var(--faint)">—</span>';
      const dist=((s.close-s.ema20)/s.ema20*100);
      const col=Math.abs(dist)<=1.5?'#f5b945':(dist>0?'var(--dim)':'#ff5d6c'); // 近 EMA20(±1.5%)=黃，回調觸線
      return `<span class="mono" style="font-size:12px">${s.ema20.toFixed(1)}</span><br><span class="mono" style="color:${col};font-size:11px">${dist>0?'+':''}${dist.toFixed(1)}%</span>`;
    }
    function rsiCell(ticker){
      const s=dataMap[ticker.toUpperCase()];
      if(!s)return '<span style="color:var(--faint)">—</span>';
      return `<span class="mono" style="font-size:12px">${s.rsi.toFixed(1)}</span>`;
    }
    let wlTab='ALL';
    function switchWL(s){
      wlTab=s;
      document.querySelectorAll('.wltab').forEach(b=>b.classList.toggle('active',b.dataset.s===s));
      render();
    }
    function ck(v){return v?'<span style="color:#2ee6a6">✓</span>':'<span style="color:#ff5d6c">✗</span>';}
    function render(){
      const th=document.getElementById('thead'), tb=document.getElementById('tbody');
      if(!list.length){th.innerHTML='';tb.innerHTML='<tr><td class="empty">仲未 mark 任何股票，去 🔍 Screener 撳⭐</td></tr>';return;}
      // 篩選：ALL=全部；否則淨係嗰個 strategy ready 嘅
      let rows=list;
      if(wlTab!=='ALL'){
        // 有標低strategy(你自己揀嗰個tab加嘅) → 淨係跟返嗰個，唔理今日仲ready唔ready，企硬喺度
        // 冇標低(舊資料，加落嚟嗰陣仲未有呢個功能) → 跌返用返舊邏輯(睇今日仲ready嘅)，avoid「唔見咗」
        rows=list.filter(it=>{
          if(it.strategy){return it.strategy===wlTab;}
          const s=dataMap[it.ticker.toUpperCase()];
          return s&&s.strategies[wlTab]&&s.strategies[wlTab].ready;
        });
      }
      if(!rows.length){th.innerHTML='';tb.innerHTML='<tr><td class="empty">呢個策略暫時未有你標低嘅 watchlist 股</td></tr>';return;}

      const earningsBadge=it=>{
        const s=dataMap[it.ticker.toUpperCase()];
        if(!s)return '';
        let out='';
        if(s.sector)out+=' <span title="GICS Sector" style="color:var(--faint);font-size:10.5px;background:var(--surface-2);padding:1px 6px;border-radius:8px">'+s.sector+'</span>';
        const se=s.sectorEvent;
        if(se&&se.days!=null&&Math.abs(se.days)<=2){
          const when=se.days===0?'今日':se.days>0?se.days+'日後':Math.abs(se.days)+'日前';
          out+=' <span title="'+se.name+'（'+when+'）" style="color:#c77dff;font-size:11px;cursor:help">'+se.icon+' '+when+se.name+'</span>';
        }
        const d=s.daysToEarnings;
        if(d==null)return out;
        if(d>=0&&d<=2)return out+' <span title="呢排啱啱出咗業績（'+s.earningsDate+'）" style="color:#ff9838;font-size:11px;cursor:help">📊剛出業績</span>';
        if(d<0&&d>=-5)return out+' <span title="'+Math.abs(d)+'日前出咗業績（'+s.earningsDate+'）" style="color:#ff9838;font-size:11px;cursor:help">📊業績後'+Math.abs(d)+'日</span>';
        if(d>0&&d<=5)return out+' <span title="仲有'+d+'日出業績（'+s.earningsDate+'）" style="color:#f5b945;font-size:11px;cursor:help">📊'+d+'日後業績</span>';
        return out;
      };
      const suggestOtherStrategies=it=>{
        const s=dataMap[it.ticker.toUpperCase()]; if(!s||!it.strategy)return '';
        const others=['S1','S1V1','S2','S3','S4','S5','S6','S7']
          .filter(k=>k!==it.strategy&&s.strategies[k]&&s.strategies[k].ready);
        if(!others.length)return '';
        return '<br><span style="font-size:10px;color:#6aabf0" title="今日呢隻都啱用呢幾個策略，但呢度企硬用你原本揀嘅'+it.strategy+'">💡今日都啱：'+others.join('、')+'</span>';
      };
      const linkCell=it=>`<td class="ticker"><a href="#" class="ticker-link" style="color:var(--accent-2)" onclick="openChart('${it.ticker}');return false;">${it.ticker} 📈</a>${earningsBadge(it)}${suggestOtherStrategies(it)}</td>`;
      const noteCell=it=>`<td><input type="text" class="note-input" value="${(it.note||'').replace(/"/g,'&quot;')}" onchange="saveNote('${it.ticker}',this.value)" placeholder="加筆記" style="width:120px"></td>`;
      const delCell=it=>`<td style="text-align:center"><button class="del-btn" onclick="removeStock('${it.ticker}')">🗑️</button></td>`;
      const shortDate=s=>{ if(!s)return '—'; const d=new Date(s); return isNaN(d)?s:d.toDateString(); };
      const dateCell=it=>`<td class="mono" style="font-size:11.5px;color:var(--dim);white-space:nowrap">${shortDate(it.dateAdded)}</td>`;
      const tvCell=it=>`<td style="text-align:center"><input type="checkbox" ${tvOpenSet.has(it.ticker.toUpperCase())?'checked':''} onchange="toggleTVTrack('${it.ticker}',this)" style="width:16px;height:16px;cursor:pointer"></td>`;

      if(wlTab==='S1'){
        // S1：跟 paper trade 欄（RSI/C1-C5/REQ/Bonus/Streak/趨勢/跌穿/企返）

    async function saveOverride(ticker, strategy, field, val, defA, defB, defExtra1){
      const key=ticker.toUpperCase()+'|'+strategy;
      const cur=overrideMap[key]||{a:defA!=null?defA:'', b:defB!=null?defB:'', extra1:defExtra1!=null?defExtra1:'', extra2:''};
      cur[field]=(val===''?'':(parseFloat(val)||''));
      overrideMap[key]=cur;
      try{
        await fetch(WL_API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
          body:JSON.stringify({action:'override_set',ticker,strategy,a:cur.a,b:cur.b,extra1:cur.extra1,extra2:cur.extra2})});
      }catch(e){}
      if(wlTab===strategy)render();
    }
    async function saveFib(ticker,a,b,h1){
      const cur=fibMap[ticker.toUpperCase()]||{a:'',b:'',h1:''};
      if(a!==null)cur.a=parseFloat(a)||'';
      if(b!==null)cur.b=parseFloat(b)||'';
      if(h1!==null)cur.h1=parseFloat(h1)||'';
      fibMap[ticker.toUpperCase()]=cur;
      try{await fetch(WL_API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'fib_set',ticker,a:cur.a,b:cur.b,h1:cur.h1})});}catch(e){}
      if(wlTab==='S6')render();
    }

      const fibLevels=[[0,'#5b6075'],[0.236,'#f5b945'],[0.382,'#888'],[0.5,'#888'],[0.618,'#888'],[0.786,'#4d8dff'],[1,'#5b6075']];
      let fibSeries=[];
      // 頸線 H1：獨立於 A/B Fib 顯示（有存低就一定畫，唔使等你剔咗「顯示Fib」先出現）
      if(pendingAB.h1){
        const h1v=parseFloat(pendingAB.h1);
        if(!isNaN(h1v)){
          const h1s=chart.addLineSeries({color:'#ff9838',lineWidth:2,lineStyle:0,lastValueVisible:true,priceLineVisible:false,crosshairMarkerVisible:false,title:'頸線H1'});
          h1s.setData([{time:d.t[0],value:h1v},{time:d.t[n-1],value:h1v}]);
        }
      }
      function drawFib(on){
        fibSeries.forEach(s=>chart.removeSeries(s));fibSeries=[];
        const fibInputs=document.getElementById('fibInputs');
        if(!on){fibInputs.style.display='none';return;}
        fibInputs.style.display='flex';
        const aInput=parseFloat(document.getElementById('fibA').value);
        const bInput=parseFloat(document.getElementById('fibB').value);
        let hi,swingLo;
        if(!isNaN(aInput)&&!isNaN(bInput)){hi=aInput;swingLo=bInput;}
        else{
          hi=Math.max(...d.h);const hiIdx=d.h.indexOf(hi);
          swingLo=hiIdx<n-1?Math.min(...d.l.slice(hiIdx)):Math.min(...d.l);
          document.getElementById('fibA').placeholder='高 ('+(hi.toFixed(2))+')';
          document.getElementById('fibB').placeholder='低 ('+(swingLo.toFixed(2))+')';
        }
        const range=hi-swingLo;
        fibLevels.forEach(([lv,fcol])=>{
          const price=hi-range*lv;
          const s=chart.addLineSeries({color:fcol,lineWidth:lv===0.236?2:1,lineStyle:lv===0.236?0:2,lastValueVisible:true,priceLineVisible:false,crosshairMarkerVisible:false,title:lv===0?'A':lv===1?'B':lv.toFixed(3)});
          s.setData([{time:d.t[0],value:price},{time:d.t[n-1],value:price}]);
          fibSeries.push(s);
        });
        const f236=(hi-range*0.236);
        const broke=d.c[n-1]<f236;
        document.getElementById('fibInfo').innerHTML=`0.236 = $${f236.toFixed(2)} · ${broke?'<span style="color:#ff5d6c">⚠ 收市跌穿 = 否決</span>':'<span style="color:#2ee6a6">✓ 守住</span>'}`;
      }
      const ft=document.getElementById('fibToggle');
      if(pendingAB.a)document.getElementById('fibA').value=pendingAB.a;
      if(pendingAB.b)document.getElementById('fibB').value=pendingAB.b;
      ft.addEventListener('change',e=>drawFib(e.target.checked));
      const saveABc=()=>{
        const a=document.getElementById('fibA').value;
        const b=document.getElementById('fibB').value;
        try{fetch(WL_API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'ab',ticker,a:parseFloat(a)||'',b:parseFloat(b)||''})});}catch(e){}
        // 更新本地 list
        const it=list.find(x=>x.ticker.toUpperCase()===ticker.toUpperCase());
        if(it){it.a=parseFloat(a)||'';it.b=parseFloat(b)||'';}
        drawFib(ft.checked);
      };
      document.getElementById('fibA').addEventListener('change',saveABc);
      document.getElementById('fibB').addEventListener('change',saveABc);
      // 有 A/B 就自動開 Fib
      if(pendingAB.a){ft.checked=true;drawFib(true);}
    }
    function closeChart(){document.getElementById('chartModal').classList.remove('show');document.getElementById('chartContainer').innerHTML='';if(lwChart){lwChart.remove();lwChart=null;}render();}
    document.getElementById('chartModal').addEventListener('click',function(e){if(e.target===this)closeChart();});
    document.addEventListener('keydown',function(e){if(e.key==='Escape')closeChart();});

    loadList();
  </script>
</body>
</html>
