<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>playbook · Checklist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0a0b12;--surface:#13141f;--surface-2:#1a1c2b;--surface-3:#20233a;
      --border:#262a3d;--border-2:#323754;--text:#e6e8f0;--dim:#8a8fa3;--faint:#5b6075;
      --accent:#7c5cff;--accent-2:#4d8dff;}
    /* 返工 Mode：淡色樸素，似 Excel/文件 */
    body.work{
      --bg:#ffffff; --surface:#ffffff; --surface-2:#f3f3f3; --surface-3:#e9e9e9;
      --border:#d9d9d9; --border-2:#c4c4c4;
      --text:#222; --dim:#777; --faint:#999;
      --accent:#5a5a5a; --accent-2:#5a5a5a;
      --up:#217346; --down:#b00020; --amber:#8a6d00;
      --glow:none;
      background-image:none !important;
    }
    body.work .brand{background:none;-webkit-text-fill-color:#333;color:#333;font-weight:600}
    body.work h1{background:none;-webkit-text-fill-color:#333;color:#333}
    body.work .topnav a.active,body.work .tab-btn.active,body.work .btn.primary{background:#e0e0e0 !important;color:#222 !important;box-shadow:none !important;border:1px solid #c4c4c4 !important}
    body.work .scard::before,body.work .new-badge{background:#999 !important;box-shadow:none !important}
    body.work .badge.perfect{background:#e8e8e8;color:#217346;box-shadow:none}
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);padding:1.25rem;display:flex;flex-direction:column;
      background-image:radial-gradient(900px 400px at 12% -8%,rgba(124,92,255,.10),transparent 60%),radial-gradient(800px 380px at 92% -10%,rgba(77,141,255,.08),transparent 60%);}
    .topbar{position:sticky;top:0;z-index:50;background:rgba(19,20,31,.92);backdrop-filter:blur(10px);
      border-bottom:1px solid var(--border);margin:-1.25rem -1.25rem 1.4rem;padding:11px 1.25rem}
    .topbar-inner{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
    .brand{font-size:20px;font-weight:700;letter-spacing:-.3px;background:linear-gradient(90deg,#fff,#b9a8ff 60%,#7fb0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
    .topnav{display:flex;gap:6px}
    .topnav a{padding:7px 16px;font-size:14px;font-weight:600;text-decoration:none;border-radius:9px;color:var(--dim);transition:.15s}
    .topnav a:hover{color:var(--text);background:var(--surface-2)}
    .topnav a.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 4px 14px rgba(124,92,255,.3)}
    .wrap{max-width:1440px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column}
    .subtabs{display:flex;gap:8px;margin-bottom:1rem}
    .stab{padding:9px 20px;font-size:14px;font-weight:600;background:var(--surface);border:1px solid var(--border);border-radius:10px;cursor:pointer;color:var(--dim);transition:.15s}
    .stab:hover{color:var(--text);border-color:var(--border-2)}
    .stab.active{background:var(--surface-3);color:#fff;border-color:var(--accent);box-shadow:0 0 0 1px rgba(124,92,255,.4),0 0 18px rgba(124,92,255,.25)}
    .frame-box{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;min-height:70vh}
    iframe{width:100%;height:100%;border:none;display:block}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">playbook</div>
      <nav class="topnav">
        <a href="overview.html">📊 Market</a>
        <a href="dashboard.html">🔍 Screener</a>
        <a href="checklist.html" class="active">✅ Checklist</a>
      </nav>
      <div style="margin-left:auto">
        <button onclick="toggleWork()" id="workBtn" style="padding:7px 12px;font-size:13px;font-weight:600;border-radius:10px;border:1px solid var(--border-2);background:var(--surface-2);color:var(--text);cursor:pointer">🕶 返工 Mode</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="subtabs">
      <button class="stab active" data-src="s1_checklist.html" onclick="loadCL(this)">S1 順勢交易</button>
      <button class="stab" data-src="s3_checklist.html" onclick="loadCL(this)">S3 突破交易</button>
      <button class="stab" data-src="s6_checklist.html" onclick="loadCL(this)">S6 圖表形態</button>
    </div>
    <div class="frame-box">
      <iframe id="clFrame" src="s1_checklist.html"></iframe>
    </div>
  </div>

  <script>
    function loadCL(btn){
      document.querySelectorAll('.stab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('clFrame').src = btn.dataset.src;
    }
      function setWork(on){
      document.body.classList.toggle('work',on);
      const b=document.getElementById('workBtn');
      if(b)b.textContent = on ? '🌙 Trader Mode' : '🕶 返工 Mode';
      try{document.cookie='workmode='+(on?'1':'0')+';path=/;max-age=31536000';}catch(e){}
    }
    function toggleWork(){setWork(!document.body.classList.contains('work'));}
    document.addEventListener('keydown',function(e){if(e.key==='`'){e.preventDefault();toggleWork();}});
    (function(){try{if(/workmode=1/.test(document.cookie))setWork(true);}catch(e){}})();

  </script>
</body>
</html>
