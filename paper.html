<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>playbook — Paper Trade</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root{--bg:#0a0b12;--surface:#13141f;--surface-2:#1a1c2b;--border:#262a3d;--text:#e6e8f0;--dim:#8a8fa3;--faint:#5b6075;--accent:#7c5cff;--up:#2ee6a6;--down:#ff5d6c;--amber:#f5b945}
    body.work{--bg:#fff;--surface:#fff;--surface-2:#f3f3f3;--border:#d0d0d0;--text:#1a1a1a;--dim:#555;--faint:#888;--accent:#444;--up:#177245;--down:#b00020;--amber:#7a5c00}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px}
    .mono{font-family:'JetBrains Mono',monospace}
    .topbar{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
    .topbar-inner{max-width:1400px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
    .brand{font-size:22px;font-weight:700;background:linear-gradient(90deg,#7c5cff,#4d8dff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    body.work .brand{background:none;-webkit-text-fill-color:#333}
    .topnav{display:flex;gap:6px;flex-wrap:wrap}
    .topnav a{color:var(--dim);text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:600}
    .topnav a.active{background:var(--accent);color:#fff}
    body.work .topnav a.active{background:#dcdcdc;color:#1a1a1a}
    .topactions{margin-left:auto;display:flex;gap:10px}
    .btn{background:var(--surface-2);color:var(--dim);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;padding:7px 12px;text-decoration:none}
    .wrap{max-width:1400px;margin:0 auto;padding:24px 20px}
    h1{font-size:22px;margin:0 0 4px}
    .sub{color:var(--dim);font-size:13px}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin:20px 0}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}
    .card .lbl{color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
    .card .val{font-size:28px;font-weight:700;line-height:1}
    .green{color:var(--up)}.red{color:var(--down)}.amber{color:var(--amber)}
    .ptab{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 16px;color:var(--dim);cursor:pointer;font-size:14px;font-weight:600}
    .ptab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    body.work .ptab.active{background:#444;border-color:#444}
    .pgroup{display:inline-flex;margin:14px 0 10px;border:1px solid var(--border);border-radius:12px;overflow:hidden;max-width:100%}
    .pgbtn{background:var(--surface);border:none;padding:9px 20px;color:var(--dim);cursor:pointer;font-size:14px;font-weight:700}
    .pgbtn+.pgbtn{border-left:1px solid var(--border)}
    .pgbtn.active{background:var(--accent);color:#fff}
    body.work .pgbtn.active{background:#444}
    .ptabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
    .ptab.hide{display:none}
    .panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin:18px 0}
    .panel h2{font-size:15px;margin:0 0 14px;color:var(--dim)}
    table{width:100%;border-collapse:collapse;font-size:13px}
    body.mobile table{font-size:14px}
    body.mobile th,body.mobile td{padding:13px 10px}
    body.mobile thead th:first-child,body.mobile tbody td:first-child{
      position:sticky;left:0;background:var(--surface);z-index:5;box-shadow:2px 0 4px rgba(0,0,0,.2)}
    th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border)}
    th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase}
    .warn{background:rgba(245,185,69,.08);border:1px solid rgba(245,185,69,.3);padding:14px 16px;border-radius:12px;margin:16px 0;line-height:1.6;font-size:13px}
    .loading{text-align:center;padding:60px;color:var(--dim)}
    .pill{padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
    .why{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:8px 0;font-size:12px;line-height:1.7}
    .why b{color:var(--text)}
    .linkbtn{background:none;border:none;color:var(--accent);cursor:pointer;font-size:12px;font-weight:600;padding:0;text-decoration:underline}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center}
    .modal.show{display:flex}
    .modalbox{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;width:min(900px,94vw)}
    .modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    #pchart{width:100%;height:380px}
    .x{background:none;border:none;color:var(--dim);font-size:22px;cursor:pointer}
  </style>
</head>
<body>
  <div class="topbar"><div class="topbar-inner">
    <div class="brand">playbook</div>
    <nav class="topnav">
      <a href="overview.html">📊 Market</a>
      <a href="dashboard.html">🔍 Screener</a>
      <a href="checklist.html">✅ Checklist</a>
      <a href="watchlist.html">📋 Watchlist</a>
      <a href="paper.html" class="active">📒 Paper Trade</a>
    </nav>
    <div class="topactions">
      <button onclick="toggleWork()" class="btn">🕶 返工 Mode</button>
      <a href="https://github.com/Sasamkeefund/playbook/actions/workflows/paper.yml" target="_blank" rel="noopener" class="btn">▶️ 行 Paper Trade</a>
    </div>
  </div></div>

  <div class="wrap">
    <h1 id="ptTitle">📝 我的 Trade Record — 喺 TradingView 真係落嘅 paper trade</h1>
    <div class="sub" id="ptSub">記低你自己喺 TradingView 落嘅 paper trade，留返個原因，儲返自己嘅trade record</div>
    <div class="pgroup">
      <button id="grpAuto" class="pgbtn" onclick="switchGroup('auto')">🤖 自動記錄</button>
      <button id="grpManual" class="pgbtn" onclick="switchGroup('manual')">✋ 人手記錄</button>
    </div>
    <div class="ptabs">
      <button id="tabAUTO" class="ptab" onclick="switchPT('AUTO')">📊 總覽</button>
      <button id="tabS1A" class="ptab" onclick="switchPT('S1A')">🟢 S1 順勢</button>
      <button id="tabS3A" class="ptab" onclick="switchPT('S3A')">📈 S3 突破</button>
      <button id="tabS5A" class="ptab" onclick="switchPT('S5A')">🎯 S5 支持阻力</button>
      <button id="tabS6A" class="ptab" onclick="switchPT('S6A')">🚩 S6 旗形</button>
      <button id="tabS7N" class="ptab" onclick="switchPT('S7N')">🚀 S7 突破</button>
      <button id="tabTV" class="ptab" onclick="switchPT('TV')">📝 我的記錄（TradingView）</button>
      <button id="tabS1" class="ptab" onclick="switchPT('S1')">✋ S1 人手揀</button>
    </div>
    <div id="content"><div class="loading">載入緊…</div></div>
  </div>

  <div class="modal" id="chartModal" onclick="if(event.target===this)closeChart()">
    <div class="modalbox">
      <div class="modalhead"><div id="chartTitle" style="font-weight:700"></div><button class="x" onclick="closeChart()">×</button></div>
      <div id="pchart"></div>
      <div class="sub" id="chartNote" style="margin-top:8px"></div>
    </div>
  </div>

  <div class="modal" id="editTVModal" onclick="if(event.target===this)closeEditTV()">
    <div class="modalbox" style="width:min(480px,94vw)">
      <div class="modalhead"><div style="font-weight:700">✏️ 編輯 <span id="editTVTicker"></span></div><button class="x" onclick="closeEditTV()">×</button></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div><label class="sub">買入價</label><input id="etEntry" type="number" step="0.01" style="width:100%;padding:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text)"></div>
        <div><label class="sub">止損</label><input id="etStop" type="number" step="0.01" style="width:100%;padding:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text)"></div>
        <div><label class="sub">止損法</label><select id="etStopMethod" onchange="suggestEditStop()" style="width:100%;padding:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text)"><option value="前底">前底</option><option value="1.5×ATR">1.5×ATR</option></select></div>
        <div><label class="sub">T1</label><input id="etT1" type="number" step="0.01" style="width:100%;padding:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text)"></div>
        <div><label class="sub">T2</label><input id="etT2" type="number" step="0.01" style="width:100%;padding:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text)"></div>
        <div><label class="sub">股數</label><input id="etQty" type="number" step="0.01" style="width:100%;padding:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text)"></div>
      </div>
      <div id="etEntryMethodWrap" style="display:none;margin-top:10px"><label class="sub">入場手法</label><select id="etEntryMethod" style="width:100%;padding:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text)"><option value="手法A(放量)">手法A(放量)</option><option value="手法C(縮量)">手法C(縮量)</option></select></div>
      <div style="margin-top:10px"><label class="sub">TradingView 連結</label><input id="etLink" type="url" placeholder="https://www.tradingview.com/x/..." style="width:100%;padding:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text)"></div>
      <div style="margin-top:10px"><label class="sub">筆記</label><textarea id="etNotes" rows="2" style="width:100%;padding:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit"></textarea></div>
      <button class="btn primary" style="margin-top:14px;background:var(--accent);color:#fff;width:100%" onclick="saveEditTV()">儲存</button>
    </div>
  </div>

  <div class="modal" id="closeTVModal" onclick="if(event.target===this)closeCloseTV()">
    <div class="modalbox" style="width:min(480px,94vw)">
      <div class="modalhead"><div style="font-weight:700">🔚 平倉 <span id="closeTVTicker"></span></div><button class="x" onclick="closeCloseTV()">×</button></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div><label class="sub">平倉價</label><input id="ctPx" type="number" step="0.01" style="width:100%;padding:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text)"></div>
        <div><label class="sub">平倉日</label><input id="ctDate" type="date" style="width:100%;padding:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text)"></div>
      </div>
      <div style="margin-top:10px">
        <label class="sub">呢次係點平嘅？</label>
        <select id="ctReason" style="width:100%;padding:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text)">
          <option value="止賺(到T2)">✅ 成功 — 止賺(到T2)</option>
          <option value="止賺(到T1)">✅ 成功 — 止賺(到T1)</option>
          <option value="止蝕(跌穿止損)">❌ 失敗 — 止蝕(跌穿止損)</option>
          <option value="提早平倉(保本/小賺)">⚠️ 提早平倉 — 保本/小賺</option>
          <option value="提早平倉(蝕住走)">⚠️ 提早平倉 — 蝕住走</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div style="margin-top:10px"><label class="sub">TradingView 連結（平倉後嘅圖／記錄）</label><input id="ctLink" type="url" placeholder="https://www.tradingview.com/x/..." style="width:100%;padding:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text)"></div>
      <div style="margin-top:10px"><label class="sub">平倉筆記</label><textarea id="ctNotes" rows="2" placeholder="點解揀呢個位平？覆盤心得？" style="width:100%;padding:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit"></textarea></div>
      <button class="btn primary" style="margin-top:14px;background:var(--accent);color:#fff;width:100%" onclick="saveCloseTV()">確認平倉</button>
    </div>
  </div>

  <div class="modal" id="t1CloseModal" onclick="if(event.target===this)closeT1Close()">
    <div class="modalbox" style="width:min(480px,94vw)">
      <div class="modalhead"><div style="font-weight:700">🎯 T1平倉 <span id="t1CloseTicker"></span></div><button class="x" onclick="closeT1Close()">×</button></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div><label class="sub">賣咗幾多股</label><input id="t1Qty" type="number" step="0.01" style="width:100%;padding:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text)"></div>
        <div><label class="sub">實際賣出價</label><input id="t1Px" type="number" step="0.01" style="width:100%;padding:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text)"></div>
      </div>
      <div id="t1QtyHint" style="font-size:11.5px;color:var(--faint);margin-top:6px"></div>
      <button class="btn primary" style="margin-top:14px;background:var(--accent);color:#fff;width:100%" onclick="saveT1Close()">確認T1平倉</button>
    </div>
  </div>

<script>
const WL_API="https://script.google.com/macros/s/AKfycbw-taBatpcuHXt5daIGq3Bo7lGw9OvdtsNeg292qdN0eW4RyxWLV4qf-oACvaVHHUI-Bg/exec";
// S3 / S5 / S6 自動記錄上線日：之前嘅訊號只係列出嚟對圖，唔計入記錄（forward test）
const AUTO_START='2026-10-02';
const _preTag=x=>x.signalDate<AUTO_START?' <span style="color:var(--faint)">（上線前，唔計入記錄）</span>':'';
function toggleWork(){
  const MODES=['trader','work','mobile'];
  const LBL={trader:'🌙 Trader Mode',work:'🕶 返工 Mode',mobile:'📱 Mobile Mode'};
  const cur=document.body.classList.contains('mobile')?'mobile':document.body.classList.contains('work')?'work':'trader';
  const nxt=MODES[(MODES.indexOf(cur)+1)%MODES.length];
  document.body.classList.toggle('work',nxt==='work');
  document.body.classList.toggle('mobile',nxt==='mobile');
  const b=document.querySelector('button[onclick="toggleWork()"]');
  if(b)b.textContent=LBL[nxt];
  try{document.cookie='uimode='+nxt+';path=/;max-age=31536000';}catch(e){}
}
(function(){var m=(document.cookie.match(/uimode=(\w+)/)||[])[1];
  if(m==='work')document.body.classList.add('work');
  else if(m==='mobile')document.body.classList.add('mobile');
  const LBL={trader:'🌙 Trader Mode',work:'🕶 返工 Mode',mobile:'📱 Mobile Mode'};
  const b=document.querySelector('button[onclick="toggleWork()"]');
  if(b&&m&&LBL[m])b.textContent=LBL[m];
})();
document.addEventListener('keydown',e=>{if(e.key==='`'){
  const w=document.body.classList.contains('work');
  document.body.classList.remove('mobile');document.body.classList.toggle('work',!w);
}});

let _allOpen=[], _allClosed=[], _ptMode='AUTO', _liveData={}, _macroData=null, _regime={}, _s1Next=[], _s7Next=[], _s6Sig=[], _s3Sig=[], _s5Sig=[], _dataSession='';
async function load(){
  const now=new Date();
  const hourKey=now.getFullYear()+''+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0')+String(now.getHours()).padStart(2,'0');
  const [paperResult, dataResult, marketResult] = await Promise.allSettled([
    fetch(WL_API+"?action=paper_list").then(r=>r.json()),
    fetch('https://raw.githubusercontent.com/Sasamkeefund/playbook/main/data.json?t='+hourKey).then(r=>r.json()),
    fetch('https://raw.githubusercontent.com/Sasamkeefund/playbook/main/market.json?t='+hourKey).then(r=>r.json())
  ]);
  if(paperResult.status==='rejected'){
    document.getElementById('content').innerHTML='<div class="warn">載入失敗。請確認 Apps Script 已更新（加咗 Paper trade）。</div>';
    return;
  }
  const d=paperResult.value;
  _allOpen=d.open||[]; _allClosed=d.closed||[];
  _liveData={};
  if(dataResult.status==='fulfilled'){
    (dataResult.value.stocks||[]).forEach(s=>{ _liveData[s.ticker.toUpperCase()]=s; });
    _regime=dataResult.value.marketRegime||{};
    _s1Next=dataResult.value.s1Next||[];
    _s7Next=dataResult.value.s7Next||[];
    _s6Sig=dataResult.value.s6Signals||[];
    _s3Sig=dataResult.value.s3Signals||[];
    _s5Sig=dataResult.value.s5Signals||[];
    _dataSession=dataResult.value.dataSession||'';
  }
  _macroData=(marketResult.status==='fulfilled')?marketResult.value:null;
  renderCurrent();
}
// ── 分頁：🤖 自動記錄（系統自己記）/ ✋ 人手記錄（你自己落）──
const PT_MODES={
  AUTO:{grp:'auto',title:'📊 自動記錄總覽 — 邊個策略做到勝率 50% 以上？',
    sub:'系統每晚 scan 完自動記錄嘅 paper trade（冇真錢）。每個策略分組對比做法，撳策略名睇詳細。'},
  S1A:{grp:'auto',title:'📒 S1 自動記錄 — 跟你平時 S1 做法，每個 🟢🔵 訊號自動記錄',
    sub:'入場：收市企返EMA20 → 掛Limit（收市價）→ 第二日開市前Check（開市<EMA20／裂口>1% 取消）→ 跌到先成交 ｜ 止損：前底實體（0% vs 1%）收市確認 ｜ T1：前頂實體 ｜ R:R≥2 到T1全平，否則T1半+T2(1.618)半'},
  S3A:{grp:'auto',title:'📒 S3 突破交易自動記錄 — 52 週高位 Buildup 突破（手法A / B / C）',
    sub:'前提：Buildup 喺 52 週高位、連續 3日🔥 ｜ 手法A：第一次突破 RV≥1.5 ｜ 手法B：假突破後再突破 RV≥1.5 ｜ 手法C：突破後守住、回測再向上 RV≥1.0 ｜ 全部 Limit @ 訊號日收市，高開>1% 取消 ｜ T1 平一半、止蝕移去入場價，T2 平餘下'},
  S5A:{grp:'auto',title:'📒 S5 支持阻力自動記錄 — 0.786 同整理區重疊（跟 checklist vs 淨結構）',
    sub:'結構：直線升浪 A→B + A 之前窄幅整理區 + 0.786 重疊 ｜ S5R 要 Scanner 4/4 連續 3日🔥；S5S 唔使 ｜ Limit @ 0.786，最多等 20 日，收市升穿 B 取消 ｜ 止蝕 A（收市） ｜ T1 = 0.618 反彈（平一半），T2 = B'},
  S6A:{grp:'auto',title:'📒 S6 旗形自動記錄 — 跟你 S6 筆記，突破 H1 自動記錄（手法A vs 手法C）',
    sub:'訊號：連續 5日🔥 整固 → 收市第一次升穿 H1（b6 0.236 守住） ｜ 手法A（RV>1.5）：Limit @ 突破日收市，高開>1% 取消 ｜ 手法C（RV≤1.5）：Limit @ H1 等回測，最多 20 日 ｜ 止蝕：旗形低×0.98（收市） ｜ T1 平一半、止蝕移去入場價，T2 平餘下'},
  S7N:{grp:'auto',title:'📒 S7 突破 — VCP 整固後放量突破先買（新版）',
    sub:'訊號：VCP 整固（S7 ready）後第一次收市放量（RVOL≥1.5）升穿整固區頂，大市 SPY>EMA200 ｜ 入場：下個交易日開市（開市要喺突破位至+5%） ｜ 止蝕：整固低位（收市） ｜ 止賺：20MA vs 10MA 兩組'},
  TV:{grp:'manual',title:'📝 我的 Trade Record — 喺 TradingView 真係落嘅 paper trade',
    sub:'記低你自己喺 TradingView 落嘅 paper trade，留返個原因，儲返自己嘅trade record'},
  S1:{grp:'manual',title:'📒 S1 Paper Trade — 人手揀股（假突破回測）',
    sub:'入場：你睇圖人手揀 ｜ 止損：1.5ATR 或 前面最底 ｜ 止賺：T1(通知) / T2(1.618)'},
};

function s1PlanTxt(entry, stop, t1){
  const risk=entry-stop;
  if(!(risk>0)||!(t1>entry))return {txt:'唔入（前頂唔高過入場價）',ok:false};
  const rr1=(t1-entry)/risk;
  if(rr1>=2)return {txt:'T1全平（R:R 1:'+rr1.toFixed(1)+'）',ok:true};
  const t2=t1+(t1-stop)*1.618, rr2=(t2-entry)/risk;
  if(rr2<2)return {txt:'唔入（R:R 唔夠）',ok:false};
  return {txt:'T1半 + T2 $'+t2.toFixed(2)+' 半（R:R 1:'+rr1.toFixed(1)+' / 1:'+rr2.toFixed(1)+'）',ok:true};
}

function checkTVEarnings(){
  const ticker=(document.getElementById('tvTicker').value||'').trim().toUpperCase();
  const warnEl=document.getElementById('tvEarningsWarn');
  if(!ticker){warnEl.innerHTML='';return;}
  const s=_liveData[ticker];
  if(!s||s.daysToEarnings==null){warnEl.innerHTML='';return;}
  const d=s.daysToEarnings;
  if(d<-5||d>5){warnEl.innerHTML='';return;}
  let msg,color,bg;

// ── 大市狀態（scanner 每晚寫入 data.json 嘅 marketRegime，按開單日期對返）──
function isoDate(s){
  if(!s)return null; s=String(s);
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  const d=new Date(s); if(isNaN(d))return null;
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
// 開單日期（或之前最近一個交易日，最多退 5 日；香港時間記錄可能早美國一日）
function regimeOf(entryDate){
  const iso=isoDate(entryDate); if(!iso)return null;
  const d=new Date(iso+'T00:00:00Z');
  for(let k=0;k<=5;k++){
    const key=new Date(d.getTime()-k*86400000).toISOString().slice(0,10);
    if(_regime[key])return _regime[key];
  }
  return null;
}
function regimeCell(entryDate){
  const r=regimeOf(entryDate);
  if(!r)return '<td style="text-align:center;color:var(--faint)">—</td>';
  const col=r.regime==='強'?'#2ee6a6':r.regime==='中'?'#f5b945':'#ff5d6c';
  const dot=r.regime==='強'?'🟢':r.regime==='中'?'🟡':'🔴';
  const tip='SPY '+r.spy+' ｜ EMA50 '+r.e50+' ｜ EMA200 '+r.e200+(r.vix!=null?' ｜ VIX '+r.vix+'（'+r.vixLevel+'）':'');
  return '<td style="text-align:center;white-space:nowrap" title="'+tip+'"><span style="color:'+col+';font-weight:700">'+dot+r.regime+'</span>'
    +(r.vix!=null?'<br><span style="font-size:10px;color:var(--dim)">VIX '+Math.round(r.vix)+'</span>':'')+'</td>';
}
// 按大市分組嘅勝率（已平倉）
function regimeStatsHtml(cl){
  if(!cl.length)return '';
  const groups=[['強','🟢 強（SPY>EMA50>EMA200）'],['中','🟡 中（SPY>EMA200）'],['弱','🔴 弱（SPY&lt;EMA200）'],[null,'— 未有大市數據']];
  let h='<div style="overflow-x:auto;margin-top:14px"><div class="sub" style="margin-bottom:6px">📈 按開單當日大市分組</div><table><thead><tr>'
    +'<th>大市</th><th>已平倉</th><th>勝率</th><th>每單期望</th><th>累計R</th></tr></thead><tbody>';
  groups.forEach(([g,label])=>{
    const sc=cl.filter(t=>{const r=regimeOf(t.entryDate);return g===null?!r:(r&&r.regime===g);});
    if(!sc.length)return;
    const w=sc.filter(t=>Number(t.r)>0).length, R=sc.reduce((a,t)=>a+(Number(t.r)||0),0), col=R>=0?'green':'red';
    h+='<tr><td>'+label+'</td><td class="mono" style="text-align:center">'+sc.length+'</td>'
      +'<td class="mono" style="text-align:center">'+Math.round(w/sc.length*100)+'%</td>'
      +'<td class="mono '+col+'" style="text-align:center">'+(R/sc.length>=0?'+':'')+(R/sc.length).toFixed(2)+'R</td>'
      +'<td class="mono '+col+'" style="text-align:center">'+(R>=0?'+':'')+R.toFixed(1)+'R</td></tr>';
  });
  return h+'</tbody></table></div>';
}
function fmtDate(s){
  if(!s)return '—';
  s=String(s);
  // 'Wed Jun 24 2026...' → 'Jun 24'
  const m=s.match(/^\w+ (\w+) (\d+) (\d+)/);
  if(m)return m[1]+' '+m[2];
  return s.slice(5);  // ISO 2026-06-24 → 06-24
}

let chartsData=null, pchart=null;
async function openChart(ticker, entry, stop){
  document.getElementById('chartModal').classList.add('show');
  document.getElementById('chartTitle').textContent=ticker+' 日線圖';
  document.getElementById('chartNote').innerHTML='🟢 入場 $'+entry+'　🔴 止損 $'+stop;
  const el=document.getElementById('pchart');
  el.innerHTML='';
  if(!chartsData){
    try{ chartsData=await (await fetch('https://raw.githubusercontent.com/Sasamkeefund/playbook/main/charts.json?t='+Date.now())).json(); }
    catch(e){ el.innerHTML='<div style="padding:40px;text-align:center;color:var(--dim)">圖表數據載入失敗</div>'; return; }
  }
  const c=chartsData[ticker];
  if(!c||!c.c){ el.innerHTML='<div style="padding:40px;text-align:center;color:var(--dim)">冇 '+ticker+' 圖表數據</div>'; return; }
  const work=document.body.classList.contains('work');
  pchart=LightweightCharts.createChart(el,{width:el.clientWidth,height:380,
    layout:{background:{color:'transparent'},textColor:work?'#555':'#8a8fa3'},
    grid:{vertLines:{color:work?'#eee':'#1a1c2b'},horzLines:{color:work?'#eee':'#1a1c2b'}},
    rightPriceScale:{borderColor:work?'#ddd':'#262a3d'},timeScale:{borderColor:work?'#ddd':'#262a3d'}});
  const base=Math.floor(Date.now()/1000)-c.c.length*86400;
  const candle=pchart.addCandlestickSeries({upColor:work?'#177245':'#2ee6a6',downColor:work?'#b00020':'#ff5d6c',wickUpColor:work?'#177245':'#2ee6a6',wickDownColor:work?'#b00020':'#ff5d6c',borderVisible:false});
  candle.setData(c.c.map((cl,i)=>({time:base+i*86400,open:c.o?c.o[i]:cl,high:c.h[i],low:c.l[i],close:cl})));
  if(c.e20){const e=pchart.addLineSeries({color:'#4d8dff',lineWidth:1});e.setData(c.e20.map((v,i)=>v?{time:base+i*86400,value:v}:null).filter(Boolean));}
  candle.createPriceLine({price:entry,color:'#2ee6a6',lineWidth:1,lineStyle:2,title:'入場'});
  candle.createPriceLine({price:stop,color:'#ff5d6c',lineWidth:1,lineStyle:2,title:'止損'});
  pchart.timeScale().fitContent();
}
function closeChart(){document.getElementById('chartModal').classList.remove('show');if(pchart){pchart.remove();pchart=null;}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeChart();});

load();
</script>
