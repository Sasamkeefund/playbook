<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>playbook — S7 Paper Trade</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root{--bg:#0a0b12;--surface:#13141f;--surface-2:#1a1c2b;--border:#262a3d;--text:#e6e8f0;--dim:#8a8fa3;--faint:#5b6075;--accent:#7c5cff;--up:#2ee6a6;--down:#ff5d6c;--amber:#f5b945}
    body.work{--bg:#fff;--surface:#fff;--surface-2:#f3f3f3;--border:#d0d0d0;--text:#1a1a1a;--dim:#555;--faint:#888;--accent:#444;--up:#177245;--down:#b00020;--amber:#7a5c00}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px}
    .mono{font-family:'JetBrains Mono',monospace}
    .topbar{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
    .topbar-inner{max-width:1400px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
    .brand{font-size:22px;font-weight:700;background:linear-gradient(90deg,#7c5cff,#4d8dff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    body.work .brand{background:none;-webkit-text-fill-color:#333}
    .topnav{display:flex;gap:6px;flex-wrap:wrap}
    .topnav a{color:var(--dim);text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:600}
    .topnav a.active{background:var(--accent);color:#fff}
    body.work .topnav a.active{background:#dcdcdc;color:#1a1a1a}
    .topactions{margin-left:auto;display:flex;gap:10px}
    .btn{background:var(--surface-2);color:var(--dim);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;padding:7px 12px;text-decoration:none}
    .wrap{max-width:1400px;margin:0 auto;padding:24px 20px}
    h1{font-size:22px;margin:0 0 4px}
    .sub{color:var(--dim);font-size:13px}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin:20px 0}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}
    .card .lbl{color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
    .card .val{font-size:28px;font-weight:700;line-height:1}
    .green{color:var(--up)}.red{color:var(--down)}.amber{color:var(--amber)}
    .ptab{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 16px;color:var(--dim);cursor:pointer;font-size:14px;font-weight:600}
    .ptab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    body.work .ptab.active{background:#444;border-color:#444}
    .panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin:18px 0}
    .panel h2{font-size:15px;margin:0 0 14px;color:var(--dim)}
    table{width:100%;border-collapse:collapse;font-size:13px}
    body.mobile table{font-size:14px}
    body.mobile th,body.mobile td{padding:13px 10px}
    body.mobile thead th:first-child,body.mobile tbody td:first-child{
      position:sticky;left:0;background:var(--surface);z-index:5;box-shadow:2px 0 4px rgba(0,0,0,.2)}
    th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border)}
    th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase}
    .warn{background:rgba(245,185,69,.08);border:1px solid rgba(245,185,69,.3);padding:14px 16px;border-radius:12px;margin:16px 0;line-height:1.6;font-size:13px}
    .loading{text-align:center;padding:60px;color:var(--dim)}
    .pill{padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
    .why{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:8px 0;font-size:12px;line-height:1.7}
    .why b{color:var(--text)}
    .linkbtn{background:none;border:none;color:var(--accent);cursor:pointer;font-size:12px;font-weight:600;padding:0;text-decoration:underline}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center}
    .modal.show{display:flex}
    .modalbox{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;width:min(900px,94vw)}
    .modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    #pchart{width:100%;height:380px}
    .x{background:none;border:none;color:var(--dim);font-size:22px;cursor:pointer}
  </style>
</head>
<body>
  <div class="topbar"><div class="topbar-inner">
    <div class="brand">playbook</div>
    <nav class="topnav">
      <a href="overview.html">📊 Market</a>
      <a href="dashboard.html">🔍 Screener</a>
      <a href="checklist.html">✅ Checklist</a>
      <a href="watchlist.html">📋 Watchlist</a>
      <a href="backtest.html">🧪 Backtest</a>
      <a href="paper.html" class="active">📒 Paper Trade</a>
    </nav>
    <div class="topactions">
      <button onclick="toggleWork()" class="btn">🕶 返工 Mode</button>
      <a href="https://github.com/Sasamkeefund/playbook/actions/workflows/paper.yml" target="_blank" rel="noopener" class="btn">▶️ 行 Paper Trade</a>
    </div>
  </div></div>

  <div class="wrap">
    <h1 id="ptTitle">📝 我的 Trade Record — 喺 TradingView 真係落嘅 paper trade</h1>
    <div class="sub" id="ptSub">記低你自己喺 TradingView 落嘅 paper trade，留返個原因，儲返自己嘅trade record</div>
    <div style="display:flex;gap:8px;margin:14px 0">
      <button id="tabTV" class="ptab active" onclick="switchPT('TV')">📝 我的記錄(TradingView)</button>
      <button id="tabS7" class="ptab" onclick="switchPT('S7')">🤖 S7 機械</button>
      <button id="tabS1" class="ptab" onclick="switchPT('S1')">✋ S1 人手揀</button>
    </div>
    <div id="content"><div class="loading">載入緊…</div></div>
  </div>

  <div class="modal" id="chartModal" onclick="if(event.target===this)closeChart()">
    <div class="modalbox">
      <div class="modalhead"><div id="chartTitle" style="font-weight:700"></div><button class="x" onclick="closeChart()">×</button></div>
      <div id="pchart"></div>
      <div class="sub" id="chartNote" style="margin-top:8px"></div>
    </div>
  </div>

  <div class="modal" id="editTVModal" onclick="if(event.target===this)closeEditTV()">
    <div class="modalbox" style="width:min(480px,94vw)">
      <div class="modalhead"><div style="font-weight:700">✏️ 編輯 <span id="editTVTicker"></span></div><button class="x" onclick="closeEditTV()">×</button></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div><label class="sub">買入價</label><input id="etEntry" type="number" step="0.01" style="width:100%;padding:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text)"></div>
        <div><label class="sub">止損</label><input id="etStop" type="number" step="0.01" style="width:100%;padding:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text)"></div>
        <div><label class="sub">止損法</label><select id="etStopMethod" onchange="suggestEditStop()" style="width:100%;padding:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text)"><option value="前底">前底</option><option value="1.5×ATR">1.5×ATR</option></select></div>
        <div><label class="sub">T1</label><input id="etT1" type="number" step="0.01" style="width:100%;padding:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text)"></div>
        <div><label class="sub">T2</label><input id="etT2" type="number" step="0.01" style="width:100%;padding:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text)"></div>
      </div>
      <div id="etEntryMethodWrap" style="display:none;margin-top:10px"><label class="sub">入場手法</label><select id="etEntryMethod" style="width:100%;padding:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text)"><option value="手法A(放量)">手法A(放量)</option><option value="手法C(縮量)">手法C(縮量)</option></select></div>
      <div style="margin-top:10px"><label class="sub">TradingView 連結</label><input id="etLink" type="url" placeholder="https://www.tradingview.com/x/..." style="width:100%;padding:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text)"></div>
      <div style="margin-top:10px"><label class="sub">筆記</label><textarea id="etNotes" rows="2" style="width:100%;padding:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit"></textarea></div>
      <button class="btn primary" style="margin-top:14px;background:var(--accent);color:#fff;width:100%" onclick="saveEditTV()">儲存</button>
    </div>
  </div>

<script>
const WL_API="https://script.google.com/macros/s/AKfycbw-taBatpcuHXt5daIGq3Bo7lGw9OvdtsNeg292qdN0eW4RyxWLV4qf-oACvaVHHUI-Bg/exec";
function toggleWork(){
  const MODES=['trader','work','mobile'];
  const LBL={trader:'🌙 Trader Mode',work:'🕶 返工 Mode',mobile:'📱 Mobile Mode'};
  const cur=document.body.classList.contains('mobile')?'mobile':document.body.classList.contains('work')?'work':'trader';
  const nxt=MODES[(MODES.indexOf(cur)+1)%MODES.length];
  document.body.classList.toggle('work',nxt==='work');
  document.body.classList.toggle('mobile',nxt==='mobile');
  const b=document.querySelector('button[onclick="toggleWork()"]');
  if(b)b.textContent=LBL[nxt];
  try{document.cookie='uimode='+nxt+';path=/;max-age=31536000';}catch(e){}
}
(function(){var m=(document.cookie.match(/uimode=(\w+)/)||[])[1];
  if(m==='work')document.body.classList.add('work');
  else if(m==='mobile')document.body.classList.add('mobile');
  const LBL={trader:'🌙 Trader Mode',work:'🕶 返工 Mode',mobile:'📱 Mobile Mode'};
  const b=document.querySelector('button[onclick="toggleWork()"]');
  if(b&&m&&LBL[m])b.textContent=LBL[m];
})();
document.addEventListener('keydown',e=>{if(e.key==='`'){
  const w=document.body.classList.contains('work');
  document.body.classList.remove('mobile');document.body.classList.toggle('work',!w);
}});

let _allOpen=[], _allClosed=[], _ptMode='TV', _liveData={};
async function load(){
  const now=new Date();
  const hourKey=now.getFullYear()+''+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0')+String(now.getHours()).padStart(2,'0');
  const [paperResult, dataResult] = await Promise.allSettled([
    fetch(WL_API+"?action=paper_list").then(r=>r.json()),
    fetch('https://raw.githubusercontent.com/Sasamkeefund/playbook/main/data.json?t='+hourKey).then(r=>r.json())
  ]);
  if(paperResult.status==='rejected'){
    document.getElementById('content').innerHTML='<div class="warn">載入失敗。請確認 Apps Script 已更新（加咗 Paper trade）。</div>';
    return;
  }
  const d=paperResult.value;
  _allOpen=d.open||[]; _allClosed=d.closed||[];
  _liveData={};
  if(dataResult.status==='fulfilled'){
    (dataResult.value.stocks||[]).forEach(s=>{ _liveData[s.ticker.toUpperCase()]=s; });
  }
  renderCurrent();
}
function switchPT(m){
  _ptMode=m;
  document.getElementById('tabS7').classList.toggle('active',m==='S7');
  document.getElementById('tabS1').classList.toggle('active',m==='S1');
  document.getElementById('tabTV').classList.toggle('active',m==='TV');
  document.getElementById('ptTitle').textContent=m==='S7'?'📒 S7 Paper Trade — 機械模擬（跟 J Law）':m==='S1'?'📒 S1 Paper Trade — 人手揀股（假突破回測）':'📝 我的 Trade Record — 喺 TradingView 真係落嘅 paper trade';
  document.getElementById('ptSub').textContent=m==='S7'?'入場：J Law 強勢股(跑贏大盤×2) ｜ 止損：1.5×ATR ｜ 止賺：跌穿20MA':m==='S1'?'入場：你睇圖人手揀 ｜ 止損：1.5ATR 或 前面最底 ｜ 止賺：T1(通知) / T2(1.618)':'記低你自己喺 TradingView 落嘅 paper trade，留返個原因，儲返自己嘅trade record';
  renderCurrent();
}
async function removeS1(ticker, entry){
  if(!confirm('確定刪除 '+ticker+' 呢個 S1 test 單？（成行消失，好似冇買過）'))return;
  try{
    await fetch(WL_API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'paper_remove',ticker,group:'S1',entry})});
    alert('已刪除 '+ticker+'。1-2秒後刷新頁面就見到。');
    setTimeout(()=>load(),1500);
  }catch(e){alert('刪除失敗，再試');}
}
async function manualCloseS1(ticker, entry){
  const px=prompt('手動平倉 '+ticker+'，輸入平倉價：');
  if(px===null||px==='')return;
  const exitPx=parseFloat(px);
  if(isNaN(exitPx)){alert('請輸入數字');return;}
  const today=new Date().toISOString().slice(0,10);
  try{
    await fetch(WL_API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'paper_manual_close',ticker,group:'S1',exitPx,exitDate:today})});
    alert('已平倉 '+ticker+' @ $'+exitPx+'。1-2秒後刷新。');
    setTimeout(()=>load(),1500);
  }catch(e){alert('平倉失敗，再試');}
}
async function removeS1Closed(ticker, entry){
  if(!confirm('確定刪除已平倉記錄 '+ticker+'？（成行消失）'))return;
  try{
    await fetch(WL_API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'paper_remove',ticker,group:'S1',entry,status:'closed'})});
    alert('已刪除 '+ticker+'。1-2秒後刷新。');
    setTimeout(()=>load(),1500);
  }catch(e){alert('刪除失敗，再試');}
}
function renderCurrent(){
  if(_ptMode==='S1')renderS1(_allOpen.filter(p=>p.group==='S1'), _allClosed.filter(p=>p.group==='S1'));
  else if(_ptMode==='TV')renderTV(_allOpen.filter(p=>p.group==='TV'), _allClosed.filter(p=>p.group==='TV'));
  else render(_allOpen.filter(p=>p.group!=='S1'&&p.group!=='TV'), _allClosed.filter(p=>p.group!=='S1'&&p.group!=='TV'));
}

function render(openP, closed){
  // 隔走無效平倉記錄（R 空白 / 入場=平倉，多數係周末stale數據bug）
  closed = closed.filter(t=>{
    const rOk = t.r!==''&&t.r!==null&&t.r!==undefined&&!isNaN(Number(t.r));
    const moved = Math.abs(Number(t.entry)-Number(t.exitPx))>=0.001;
    return rOk && moved;
  });
  // 分 A / B 組
  const grpStat=(g)=>{
    const op=openP.filter(p=>(p.group||'A')===g);
    const cl=closed.filter(t=>(t.group||'A')===g);
    const w=cl.filter(t=>Number(t.r)>0);
    const tR=cl.reduce((a,t)=>a+(Number(t.r)||0),0);
    return {open:op.length, closed:cl.length, wr:cl.length?Math.round(w.length/cl.length*100):0,
            exp:cl.length?tR/cl.length:0, totalR:tR};
  };
  const A=grpStat('A'), B=grpStat('B'), C=grpStat('C'), D=grpStat('D');

  const n=closed.length;
  let h='';

  // A/B/C/D 對比（2×2：入場 × 止賺）
  h+='<div class="panel"><h2>🔬 4 組對比（入場 × 止賺）</h2>';
  h+='<div style="overflow-x:auto"><table><thead><tr><th>組別</th><th>入場</th><th>止賺</th><th>持倉中</th><th>已平倉</th><th>勝率</th><th>每單期望</th><th>累計R</th></tr></thead><tbody>';
  const row=(g,inn,trail,s)=>{
    const ec=s.exp>=0?'green':'red', tc=s.totalR>=0?'green':'red';
    return '<tr><td><b>'+g+'</b></td><td style="font-size:12px">'+inn+'</td><td style="font-size:12px">'+trail+'</td><td class="mono">'+s.open+'</td><td class="mono">'+s.closed+'</td><td class="mono">'+(s.closed?s.wr+'%':'—')+'</td><td class="mono '+ec+'">'+(s.closed?(s.exp>=0?'+':'')+s.exp.toFixed(2)+'R':'—')+'</td><td class="mono '+tc+'">'+(s.closed?(s.totalR>=0?'+':'')+s.totalR.toFixed(1)+'R':'—')+'</td></tr>';
  };
  h+=row('A','全部','20MA',A);
  h+=row('B','Bonus5/5','20MA',B);
  h+=row('C','全部','10MA',C);
  h+=row('D','Bonus5/5','10MA',D);
  h+='</tbody></table></div>';
  h+='<div class="sub" style="margin-top:8px">💡 對比方法：<b>A vs B</b>（或 C vs D）= 揀股有冇用（全部 vs 只買5/5）｜ <b>A vs C</b>（或 B vs D）= 止賺線（20MA vs 10MA）邊個好。儲夠數據睇邊組「每單期望」最高。</div></div>';

  if(n===0&&openP.length===0){
    h+='<div class="warn">仲未有任何模擬交易。每次 scan 後會自動開倉（A=純J Law，B=加VCP）。耐心儲幾星期數據先有意義。</div>';
  }

  // 點解買入（純 J Law）
  h+='<div class="why">📖 <b>點解 Paper Trade 會買入？</b>　系統揾到符合 <b>J Law 強勢股</b>全部條件就自動模擬買入：<br>① 距52週高 ≤2%　② 股價 > 200MA　③ 10MA > 20MA　④ EMA50 > EMA200（黃金排列）<br>⑤ 放量　⑥ 跑贏大盤 ×2（1個月升幅 ≥ 大盤×2）<br><b>入場：</b>隔日開市　<b>止損：</b>1.5×ATR　<b>止賺：</b>收市跌穿 20MA（let winners run）<br><span style="color:var(--faint)">※ 純機械測試：S7 一 ready 就自動買，唔需要人手。測 J Law 篩選本身夠唔夠強。</span></div>';

  // 持倉中（表格）
  h+='<div class="panel"><h2>📌 持倉中（'+openP.length+'）</h2>';
  if(openP.length){
    h+='<div style="overflow-x:auto"><table><thead><tr>'
      +'<th>組</th><th>股</th><th>入場日</th><th>買入價</th><th>現價</th><th>止損</th><th>風險</th><th>跑贏大盤</th><th>Bonus</th><th>止賺</th><th>圖</th>'
      +'</tr></thead><tbody>';
    openP.forEach(p=>{
      const risk=(p.entry&&p.stop)?((p.entry-p.stop)/p.entry*100).toFixed(1)+'%':'—';
      const rs=(p.m1!=null&&p.spy1m!=null)?(p.m1+'% vs '+p.spy1m+'%'):'—';
      const g=p.group||'A';
      const gc=g==='B'?'#7c5cff':'#4d8dff';
      const live7=_liveData[p.ticker.toUpperCase()];
      const cur7=live7?live7.close:null;
      const curPct7=(cur7!=null&&p.entry)?((cur7-p.entry)/p.entry*100):null;
      const curColor7=curPct7==null?'':(curPct7>=0?'green':'red');
      const curCell7=cur7!=null
        ?'<td class="mono '+curColor7+'">$'+cur7.toFixed(2)+'<br><span style="font-size:10px">'+(curPct7>=0?'+':'')+curPct7.toFixed(1)+'%</span></td>'
        :'<td class="mono" style="color:var(--faint)">—</td>';
      h+='<tr>'
        +'<td style="font-weight:700;color:'+gc+'">'+g+'</td>'
        +'<td><b>'+p.ticker+'</b></td>'
        +'<td class="mono">'+p.entryDate+'</td>'
        +'<td class="mono">$'+p.entry+'</td>'
        +curCell7
        +'<td class="mono red">$'+p.stop+'</td>'
        +'<td class="mono">'+risk+'</td>'
        +'<td class="mono" style="font-size:11px">'+rs+'</td>'
        +'<td class="mono" style="text-align:center">'+(p.bonus||'—')+'/5</td>'
        +'<td style="font-size:11px;color:var(--dim)">跌穿20MA</td>'
        +'<td><button class="linkbtn" onclick="openChart(\''+p.ticker+'\','+p.entry+','+p.stop+')">📈</button></td>'
        +'</tr>';
    });
    h+='</tbody></table></div>';
  }else h+='<div class="sub">冇持倉</div>';
  h+='</div>';

  // 已平倉
  h+='<div class="panel"><h2>📋 已平倉（'+n+'）</h2>';
  if(n){
    h+='<table><thead><tr><th>股</th><th>入場日</th><th>平倉日</th><th>入場</th><th>平倉</th><th>原因</th><th>R</th><th>%</th><th></th></tr></thead><tbody>';
    closed.slice().reverse().forEach(t=>{
      const rcol=Number(t.r)>=0?'green':'red';

        +'<td style="text-align:center">'+(p.streak||'—')+' / '+(p.trend||'—')+'</td>'
        +'<td style="font-size:11px;max-width:160px;white-space:pre-wrap">'+(p.notes||'—')+'</td>'
        +'<td>'+(p.tvLink?'<a href="'+p.tvLink+'" target="_blank" class="linkbtn">🔗TV</a>':'<span style="color:var(--faint)">—</span>')+'</td>'
        +'<td><button class="linkbtn" onclick="openChart(\''+p.ticker+'\','+(p.entry||0)+','+(p.stop||0)+')">📈</button></td>'
        +'<td style="white-space:nowrap"><button class="linkbtn" onclick="editTV(\''+p.ticker+'\')">✏️編輯</button> <button class="linkbtn" style="color:#2ee6a6" onclick="manualCloseTV(\''+p.ticker+'\','+(p.entry||0)+')">平倉</button> <button class="linkbtn" style="color:#ff5d6c" onclick="removeTV(\''+p.ticker+'\','+(p.entry||0)+',\'open\')">刪除</button></td>'
        +'</tr>';
    });
    h+='</tbody></table></div>';
  }else h+='<div class="sub">仲未有記錄。喺上面「新增記錄」填低第一筆，或者喺 Screener 度 tick 「📝TV」欄。</div>';
  h+='</div>';

  // 已平倉
  h+='<div class="panel"><h2>📋 已平倉（'+cl.length+'）</h2>';
  if(cl.length){
    h+='<div style="overflow-x:auto"><table><thead><tr>'
      +'<th>股</th><th>策略</th><th>入場日</th><th>平倉日</th><th>入場</th><th>平倉</th><th>R</th><th>%</th><th>REQ</th><th>Bonus</th><th>筆記</th><th>連結</th><th>操作</th>'
      +'</tr></thead><tbody>';
    cl.slice().reverse().forEach(t=>{
      const rcol=Number(t.r)>=0?'green':'red';
      const reqCk=['c1','c2','c3','c4','c5'].map((k,i)=>t[k]!=null&&t[k]!==''?('C'+(i+1)+(Number(t[k])?'✓':'✗')):'').filter(Boolean).join(' ');
      const bonusParts=(t.bonus||'').toString().split('::');
      const bonusNum=bonusParts[0];
      const bonusTip=bonusParts[1]||'';
      h+='<tr>'
        +'<td><b>'+t.ticker+'</b></td>'
        +'<td style="font-size:11px;color:var(--accent);font-weight:700">'+(t.state||'—').split('|')[0].trim()+'</td>'
        +'<td class="mono">'+fmtDate(t.entryDate)+'</td>'
        +'<td class="mono">'+fmtDate(t.exitDate)+'</td>'
        +'<td class="mono">$'+t.entry+'</td>'
        +'<td class="mono">$'+t.exitPx+'</td>'
        +'<td class="mono '+rcol+'">'+(Number(t.r)>=0?'+':'')+t.r+'R</td>'
        +'<td class="mono '+rcol+'">'+(Number(t.pct)>=0?'+':'')+t.pct+'%</td>'
        +'<td style="text-align:center;cursor:help" title="'+(reqCk||'冇存到逐項')+'">'+(t.req!==''&&t.req!=null?t.req:'—')+'</td>'
        +'<td style="text-align:center;cursor:help" title="'+(bonusTip||'冇存到逐項')+'">'+(bonusNum!==''&&bonusNum!=null?bonusNum:'—')+'</td>'
        +'<td style="font-size:11px;max-width:200px;white-space:pre-wrap">'+(t.notes||'—')+'</td>'
        +'<td>'+(t.tvLink?('<a href="'+t.tvLink+'" target="_blank" class="linkbtn">🔗TV</a> '):'')+'<button class="linkbtn" onclick="addLinkClosed(\''+t.ticker+'\','+t.entry+')">'+(t.tvLink?'✏️':'➕連結')+'</button></td>'
        +'<td><button class="linkbtn" style="color:#6aabf0" onclick="reopenTV(\''+t.ticker+'\','+t.entry+')">↩️打開返</button> <button class="linkbtn" style="color:#ff5d6c" onclick="removeTV(\''+t.ticker+'\','+t.entry+',\'closed\')">刪除</button></td>'
        +'</tr>';
    });
    h+='</tbody></table></div>';
  }else h+='<div class="sub">仲未有已平倉記錄。</div>';
  h+='</div>';

  h+='<div class="warn"><b>📝 呢個係你自己嘅 trade journal。</b>入場原因/筆記存喺「策略」隔籬嗰個位，平倉時可以自己覆盤返點解贏/點解輸。</div>';

  document.getElementById('content').innerHTML=h;
}
function suggestTVStop(){
  const method=document.getElementById('tvStopMethod').value;
  if(method!=='1.5×ATR')return;
  const ticker=(document.getElementById('tvTicker').value||'').trim().toUpperCase();
  const entryEl=document.getElementById('tvEntry');
  const entry=parseFloat(entryEl.value);
  const live=_liveData[ticker];
  if(!live||!live.atr14){return;}
  const base=(!isNaN(entry)&&entry>0)?entry:live.close;
  const stop=(base-live.atr14*1.5).toFixed(2);
  document.getElementById('tvStop').value=stop;
  if(!entryEl.value)entryEl.value=live.close;
}
function toggleTVEntryMethod(){
  const s=document.getElementById('tvStrategy').value;
  document.getElementById('tvEntryMethodWrap').style.display=(s==='S6')?'':'none';
}
async function addTV(){
  const ticker=(document.getElementById('tvTicker').value||'').trim().toUpperCase();
  const strategy=document.getElementById('tvStrategy').value;
  const entryDate=document.getElementById('tvDate').value;
  const entry=document.getElementById('tvEntry').value;
  const stop=document.getElementById('tvStop').value;
  const stopMethod=document.getElementById('tvStopMethod').value;
  const entryMethod=(strategy==='S6')?document.getElementById('tvEntryMethod').value:'';
  const t1=document.getElementById('tvT1').value;
  const t2=document.getElementById('tvT2').value;
  const notes=document.getElementById('tvNotes').value;
  if(!ticker||!entry||!stop){alert('至少要填 Ticker、買入價、止損');return;}
  try{
    await fetch(WL_API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'paper_open',ticker,group:'TV',entryDate,entry,stop,
        state:strategy+' | '+stopMethod+(entryMethod?' | '+entryMethod:''), t1, t2, notes})});
    alert('已新增 '+ticker+'。1-2秒後刷新。');
    setTimeout(()=>load(),1500);
  }catch(e){alert('新增失敗，再試');}
}
let _editTVTicker=null;
let _editTVStrategy=null;
function editTV(ticker){
  const rec=_allOpen.find(p=>p.ticker===ticker&&p.group==='TV');
  if(!rec){alert('搵唔到記錄');return;}
  _editTVTicker=ticker;
  const parts=(rec.state||'').split('|');
  _editTVStrategy=(parts[0]||'').trim();
  document.getElementById('editTVTicker').textContent=ticker;
  document.getElementById('etEntry').value=rec.entry||'';
  document.getElementById('etStop').value=rec.stop||'';
  document.getElementById('etStopMethod').value=(parts[1]||'前底').trim()==='1.5×ATR'?'1.5×ATR':'前底';
  document.getElementById('etEntryMethodWrap').style.display=(_editTVStrategy==='S6')?'':'none';
  if(_editTVStrategy==='S6')document.getElementById('etEntryMethod').value=(parts[2]||'').trim()==='手法C(縮量)'?'手法C(縮量)':'手法A(放量)';
  document.getElementById('etT1').value=rec.t1||'';
  document.getElementById('etT2').value=rec.t2||'';
  document.getElementById('etLink').value=rec.tvLink||'';
  document.getElementById('etNotes').value=rec.notes||'';
  document.getElementById('editTVModal').classList.add('show');
}
function suggestEditStop(){
  const method=document.getElementById('etStopMethod').value;
  if(method!=='1.5×ATR'||!_editTVTicker)return;
  const live=_liveData[_editTVTicker.toUpperCase()];
  if(!live||!live.atr14)return;
  const entryEl=document.getElementById('etEntry');
  const entry=parseFloat(entryEl.value);
  const base=(!isNaN(entry)&&entry>0)?entry:live.close;
  document.getElementById('etStop').value=(base-live.atr14*1.5).toFixed(2);
  if(!entryEl.value)entryEl.value=live.close;
}
function closeEditTV(){document.getElementById('editTVModal').classList.remove('show');_editTVTicker=null;}
async function saveEditTV(){
  if(!_editTVTicker)return;
  const payload={action:'paper_edit',ticker:_editTVTicker,group:'TV',status:'open'};
  const entry=document.getElementById('etEntry').value;
  const stop=document.getElementById('etStop').value;
  const stopMethod=document.getElementById('etStopMethod').value;
  const entryMethod=(_editTVStrategy==='S6')?document.getElementById('etEntryMethod').value:'';
  const t1=document.getElementById('etT1').value;
  const t2=document.getElementById('etT2').value;
  const link=document.getElementById('etLink').value;
  const notes=document.getElementById('etNotes').value;
  if(entry!=='')payload.entry=parseFloat(entry);
  if(stop!=='')payload.stop=parseFloat(stop);
  if(t1!=='')payload.t1=parseFloat(t1);
  if(t2!=='')payload.t2=parseFloat(t2);
  payload.state=(_editTVStrategy||'')+' | '+stopMethod+(entryMethod?' | '+entryMethod:'');
  payload.tvLink=link;
  payload.notes=notes;
  try{
    await fetch(WL_API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
    closeEditTV();
    alert('已更新。1-2秒後刷新。');
    setTimeout(()=>load(),1500);
  }catch(e){alert('更新失敗，再試');}
}
async function manualCloseTV(ticker, entry){
  const px=prompt('平倉 '+ticker+'，輸入平倉價：');
  if(px===null||px==='')return;
  const exitPx=parseFloat(px);
  if(isNaN(exitPx)){alert('請輸入數字');return;}
  const today=new Date().toISOString().slice(0,10);
  try{
    await fetch(WL_API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'paper_manual_close',ticker,group:'TV',exitPx,exitDate:today})});
    alert('已平倉 '+ticker+' @ $'+exitPx+'。1-2秒後刷新。');
    setTimeout(()=>load(),1500);
  }catch(e){alert('平倉失敗，再試');}
}
async function reopenTV(ticker, entry){
  if(!confirm('確定將 '+ticker+' 打開返做「持倉中」？（清空平倉資料，其他嘢會保留）'))return;
  try{
    await fetch(WL_API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'paper_reopen',ticker,group:'TV',matchEntry:entry})});
    alert('已打開返 '+ticker+'。1-2秒後刷新。');
    setTimeout(()=>load(),1500);
  }catch(e){alert('操作失敗，再試');}
}
async function addLinkClosed(ticker, entry){
  const rec=_allClosed.find(t=>t.ticker===ticker&&t.group==='TV'&&Number(t.entry)===Number(entry));
  const link=prompt('TradingView 連結：', rec?(rec.tvLink||''):'');
  if(link===null)return;
  try{
    await fetch(WL_API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'paper_edit',ticker,group:'TV',status:'closed',matchEntry:entry,tvLink:link})});
    alert('已更新。1-2秒後刷新。');
    setTimeout(()=>load(),1500);
  }catch(e){alert('更新失敗，再試');}
}
async function removeTV(ticker, entry, status){
  if(!confirm('確定刪除 '+ticker+' 呢筆記錄？（成行消失）'))return;
  try{
    await fetch(WL_API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'paper_remove',ticker,group:'TV',entry,status})});
    alert('已刪除 '+ticker+'。1-2秒後刷新。');
    setTimeout(()=>load(),1500);
  }catch(e){alert('刪除失敗，再試');}
}

function fmtDate(s){
  if(!s)return '—';
  s=String(s);
  // 'Wed Jun 24 2026...' → 'Jun 24'
  const m=s.match(/^\w+ (\w+) (\d+) (\d+)/);
  if(m)return m[1]+' '+m[2];
  return s.slice(5);  // ISO 2026-06-24 → 06-24
}

let chartsData=null, pchart=null;
async function openChart(ticker, entry, stop){
  document.getElementById('chartModal').classList.add('show');
  document.getElementById('chartTitle').textContent=ticker+' 日線圖';
  document.getElementById('chartNote').innerHTML='🟢 入場 $'+entry+'　🔴 止損 $'+stop;
  const el=document.getElementById('pchart');
  el.innerHTML='';
  if(!chartsData){
    try{ chartsData=await (await fetch('https://raw.githubusercontent.com/Sasamkeefund/playbook/main/charts.json?t='+Date.now())).json(); }
    catch(e){ el.innerHTML='<div style="padding:40px;text-align:center;color:var(--dim)">圖表數據載入失敗</div>'; return; }
  }
  const c=chartsData[ticker];
  if(!c||!c.c){ el.innerHTML='<div style="padding:40px;text-align:center;color:var(--dim)">冇 '+ticker+' 圖表數據</div>'; return; }
  const work=document.body.classList.contains('work');
  pchart=LightweightCharts.createChart(el,{width:el.clientWidth,height:380,
    layout:{background:{color:'transparent'},textColor:work?'#555':'#8a8fa3'},
    grid:{vertLines:{color:work?'#eee':'#1a1c2b'},horzLines:{color:work?'#eee':'#1a1c2b'}},
    rightPriceScale:{borderColor:work?'#ddd':'#262a3d'},timeScale:{borderColor:work?'#ddd':'#262a3d'}});
  const base=Math.floor(Date.now()/1000)-c.c.length*86400;
  const candle=pchart.addCandlestickSeries({upColor:work?'#177245':'#2ee6a6',downColor:work?'#b00020':'#ff5d6c',wickUpColor:work?'#177245':'#2ee6a6',wickDownColor:work?'#b00020':'#ff5d6c',borderVisible:false});
  candle.setData(c.c.map((cl,i)=>({time:base+i*86400,open:c.o?c.o[i]:cl,high:c.h[i],low:c.l[i],close:cl})));
  if(c.e20){const e=pchart.addLineSeries({color:'#4d8dff',lineWidth:1});e.setData(c.e20.map((v,i)=>v?{time:base+i*86400,value:v}:null).filter(Boolean));}
  candle.createPriceLine({price:entry,color:'#2ee6a6',lineWidth:1,lineStyle:2,title:'入場'});
  candle.createPriceLine({price:stop,color:'#ff5d6c',lineWidth:1,lineStyle:2,title:'止損'});
  pchart.timeScale().fitContent();
}
function closeChart(){document.getElementById('chartModal').classList.remove('show');if(pchart){pchart.remove();pchart=null;}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeChart();});

load();
</script>
